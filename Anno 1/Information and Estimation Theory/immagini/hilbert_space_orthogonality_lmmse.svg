<svg width="100%" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Titolo Superiore -->
  <text x="360" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Geometria nello Spazio di Hilbert L² e Principio di Ortogonalità</text>
  <text x="360" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">L'errore ottimo ε è ortogonale al sottospazio dei dati: Teorema di Pitagora stocastico</text>

  <!-- Piano Sottospazio S(x) -->
  <!-- Parallelogramma in prospettiva -->
  <polygon points="90,260 270,140 650,140 470,260" fill="url(#planeGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 2"/>
  <text x="580" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Sottospazio dei dati S(x)</text>
  <text x="580" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">span{x[0]−μ₀, …, x[N−1]−μ_N₋₁}</text>

  <!-- Origine O -->
  <circle cx="210" cy="225" r="4" fill="#94a3b8"/>
  <text x="192" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">0</text>

  <!-- Vettore Proiezione: θ̂_LMMSE - μ_θ (giace sul piano) -->
  <!-- Da (210, 225) a (420, 200) -->
  <line x1="210" y1="225" x2="415" y2="200" stroke="#10b981" stroke-width="2.6" marker-end="url(#arrowEmerald)"/>
  <circle cx="420" cy="200" r="3.5" fill="#10b981"/>
  <text x="330" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#10b981">θ̂_LMMSE − μ_θ = aᵀ(x − μ_x)</text>

  <!-- Vettore Parametro: θ - μ_θ (esce dal piano) -->
  <!-- Da (210, 225) a (420, 80) -->
  <line x1="210" y1="225" x2="416" y2="84" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#arrowAmber)"/>
  <circle cx="420" cy="80" r="4" fill="#f59e0b"/>
  <text x="285" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="bold" fill="#f59e0b">θ − μ_θ</text>
  <text x="270" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#94a3b8">||θ − μ_θ||² = σ_θ²</text>

  <!-- Vettore Errore: ε = θ - θ̂_LMMSE (cade perpendicolarmente sul piano) -->
  <!-- Da (420, 80) a (420, 195) -->
  <line x1="420" y1="80" x2="420" y2="193" stroke="#f43f5e" stroke-width="2.6" stroke-dasharray="none" marker-end="url(#arrowRose)"/>
  <text x="435" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="bold" fill="#f43f5e">ε = θ − θ̂_LMMSE</text>
  <text x="435" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#94a3b8">||ε||² = BMSE</text>

  <!-- Simbolo Angolo Retto tra ε e il piano -->
  <path d="M 420 185 L 406 187 L 406 201" fill="none" stroke="#f43f5e" stroke-width="1.4"/>
  <circle cx="413" cy="193" r="1.5" fill="#f43f5e"/>
  <text x="380" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">90° ⊥</text>

  <!-- Condizione di Ortogonalità Box Destra -->
  <rect x="510" y="65" width="190" height="60" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="605" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Ortogonalità Stocastica</text>
  <text x="605" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e2e8f0">⟨ε, x[n] − μ_n⟩ = 0</text>
  <text x="605" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">E[(x − μ_x) ε] = 0</text>

  <!-- Box Decomposizione Pitagorica Inferiore -->
  <rect x="90" y="275" width="540" height="35" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="360" y="297" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">
    <tspan fill="#f59e0b" font-weight="bold">σ_θ²</tspan> = 
    <tspan fill="#10b981" font-weight="bold">c_xθᵀ C_xx⁻¹ c_xθ</tspan> + 
    <tspan fill="#f43f5e" font-weight="bold">BMSE</tspan>
    <tspan fill="#94a3b8"> ⟹ </tspan>
    <tspan fill="#f43f5e" font-weight="bold">BMSE</tspan> = 
    <tspan fill="#f59e0b" font-weight="bold">σ_θ²</tspan> − 
    <tspan fill="#10b981" font-weight="bold">c_xθᵀ C_xx⁻¹ c_xθ ≤ σ_θ²</tspan>
  </text>
</svg>
