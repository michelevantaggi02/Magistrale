<svg width="100%" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Sfondo bianco tipografico -->
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Titolo Superiore -->
  <text x="360" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Geometria nello Spazio di Hilbert L² e Principio di Ortogonalità</text>
  <text x="360" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">L'errore ottimo ε è ortogonale al sottospazio dei dati: Teorema di Pitagora stocastico</text>

  <!-- Piano Sottospazio S(x) -->
  <polygon points="90,260 270,140 650,140 470,260" fill="url(#planeGrad)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="4 2"/>
  <text x="580" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Sottospazio dei dati S(x)</text>
  <text x="580" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">span{x[0]−μ₀, …, x[N−1]−μ_N₋₁}</text>

  <!-- Origine O -->
  <circle cx="210" cy="225" r="4" fill="#334155"/>
  <text x="192" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#334155">0</text>

  <!-- Vettore Proiezione: θ̂_LMMSE - μ_θ (giace sul piano) -->
  <line x1="210" y1="225" x2="415" y2="200" stroke="#059669" stroke-width="2.6" marker-end="url(#arrowEmerald)"/>
  <circle cx="420" cy="200" r="3.5" fill="#059669"/>
  <text x="330" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#047857">θ̂_LMMSE − μ_θ = aᵀ(x − μ_x)</text>

  <!-- Vettore Parametro: θ - μ_θ (esce dal piano) -->
  <line x1="210" y1="225" x2="416" y2="84" stroke="#d97706" stroke-width="2.6" marker-end="url(#arrowAmber)"/>
  <circle cx="420" cy="80" r="4" fill="#d97706"/>
  <text x="285" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">θ − μ_θ</text>
  <text x="270" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">||θ − μ_θ||² = σ_θ²</text>

  <!-- Vettore Errore: ε = θ - θ̂_LMMSE (cade perpendicolarmente sul piano) -->
  <line x1="420" y1="80" x2="420" y2="193" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="none" marker-end="url(#arrowRose)"/>
  <text x="435" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">ε = θ − θ̂_LMMSE</text>
  <text x="435" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">||ε||² = BMSE</text>

  <!-- Simbolo Angolo Retto tra ε e il piano -->
  <path d="M 420 185 L 406 187 L 406 201" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <circle cx="413" cy="193" r="1.5" fill="#dc2626"/>
  <text x="380" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">90° ⊥</text>

  <!-- Condizione di Ortogonalità Box Destra -->
  <rect x="510" y="65" width="190" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="605" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Ortogonalità Stocastica</text>
  <text x="605" y="102" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">⟨ε, x[n] − μ_n⟩ = 0</text>
  <text x="605" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">E[(x − μ_x) ε] = 0</text>

  <!-- Box Decomposizione Pitagorica Inferiore -->
  <rect x="90" y="275" width="540" height="35" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="360" y="297" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">
    <tspan fill="#b45309" font-weight="bold">σ_θ²</tspan> = 
    <tspan fill="#047857" font-weight="bold">c_xθᵀ C_xx⁻¹ c_xθ</tspan> + 
    <tspan fill="#b91c1c" font-weight="bold">BMSE</tspan>
    <tspan fill="#475569" font-weight="bold"> ⟹ </tspan>
    <tspan fill="#b91c1c" font-weight="bold">BMSE</tspan> = 
    <tspan fill="#b45309" font-weight="bold">σ_θ²</tspan> − 
    <tspan fill="#047857" font-weight="bold">c_xθᵀ C_xx⁻¹ c_xθ ≤ σ_θ²</tspan>
  </text>
</svg>