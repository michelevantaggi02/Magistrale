<svg width="100%" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente per la curva dell'informazione in bit -->
    <linearGradient id="bitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Griglia di sfondo sottile -->
  <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.5">
    <line x1="80" y1="60" x2="600" y2="60" />
    <line x1="80" y1="120" x2="600" y2="120" />
    <line x1="80" y1="180" x2="600" y2="180" />
    <line x1="80" y1="240" x2="600" y2="240" />
    <line x1="210" y1="30" x2="210" y2="260" />
    <line x1="340" y1="30" x2="340" y2="260" />
    <line x1="470" y1="30" x2="470" y2="260" />
    <line x1="600" y1="30" x2="600" y2="260" />
  </g>

  <!-- Assi Cartesiani -->
  <line x1="80" y1="260" x2="630" y2="260" stroke="#94a3b8" stroke-width="2" />
  <line x1="80" y1="260" x2="80" y2="20" stroke="#94a3b8" stroke-width="2" />

  <!-- Frecce Assi -->
  <polygon points="630,260 620,255 620,265" fill="#94a3b8" />
  <polygon points="80,20 75,30 85,30" fill="#94a3b8" />

  <!-- Etichette Assi -->
  <text x="635" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">p</text>
  <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">I(p)</text>
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">1.0</text>
  <text x="340" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">0.5</text>
  <text x="210" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">0.25</text>
  <text x="145" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">0.125</text>

  <!-- Valori asse Y (bit) -->
  <text x="70" y="264" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">0</text>
  <text x="70" y="204" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">1 bit</text>
  <text x="70" y="144" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">2 bit</text>
  <text x="70" y="84" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">3 bit</text>

  <!-- Curva di Hartley (base 10) in viola tenue -->
  <path d="M 90 190 Q 200 245 600 260" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.7"/>

  <!-- Curva in Nat (base e) in ambra -->
  <path d="M 90 135 Q 180 230 600 260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" fill="none" opacity="0.85"/>

  <!-- Area sottesa Curva di Shannon (base 2) -->
  <path d="M 95 40 Q 115 120 145 80 L 145 80 Q 210 140 340 200 Q 470 240 600 260 L 600 260 L 95 260 Z" fill="url(#bitGrad)" opacity="0.5"/>

  <!-- Curva di Shannon (base 2) I(p) = -log2(p) -->
  <!-- p=1 -> I=0 (y=260), p=0.5 -> I=1 (y=200), p=0.25 -> I=2 (y=140), p=0.125 -> I=3 (y=80), p=0.0625 -> I=4 (y=20) -->
  <path d="M 112 20 Q 125 50 145 80 Q 170 115 210 140 Q 260 175 340 200 Q 460 238 600 260" stroke="#38bdf8" stroke-width="3" fill="none" />

  <!-- Punti notevoli evidenziati -->
  <!-- p=1, I=0 -->
  <circle cx="600" cy="260" r="5" fill="#38bdf8" />
  <!-- p=0.5, I=1 -->
  <circle cx="340" cy="200" r="5" fill="#38bdf8" />
  <!-- p=0.25, I=2 -->
  <circle cx="210" cy="140" r="5" fill="#38bdf8" />
  <!-- p=0.125, I=3 -->
  <circle cx="145" cy="80" r="5" fill="#38bdf8" />

  <!-- Callout esplicativo p=1 -->
  <g transform="translate(480, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="85" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Evento Certo (p = 1)</text>
    <text x="85" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">I(p) = 0 bit (Zero Sorpresa)</text>
  </g>

  <!-- Callout esplicativo p=0.5 -->
  <g transform="translate(245, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="75" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Moneta Equa (p = 1/2)</text>
    <text x="75" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">I(p) = 1.0 bit esatto</text>
  </g>

  <!-- Callout p -> 0 -->
  <g transform="translate(100, 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="42" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="90" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">Evento Raro (p → 0)</text>
    <text x="90" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">I(p) → +∞ (Sorpresa Massima)</text>
  </g>

  <!-- Legenda basi -->
  <g transform="translate(420, 45)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="32" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Base 2 (Bit) — log₂(1/p)</text>
    
    <line x1="0" y1="18" x2="25" y2="18" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Base e (Nat) — ln(1/p)</text>
    
    <line x1="0" y1="36" x2="25" y2="36" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="32" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Base 10 (Hartley) — log₁₀(1/p)</text>
  </g>
</svg>
