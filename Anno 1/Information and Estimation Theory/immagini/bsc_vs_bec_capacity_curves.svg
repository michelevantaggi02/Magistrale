  <text x="460" y="38" class="title">Confronto Geometrico tra Capacità: BSC vs BEC</text>
  <text x="460" y="58" class="subtitle">Impatto del Tipo di Rumore: Bit-Flip Inosservato (BSC) vs Cancellazione Rilevata (BEC)</text>

