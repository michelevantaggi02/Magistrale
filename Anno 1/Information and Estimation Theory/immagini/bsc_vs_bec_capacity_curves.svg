  <!-- Vertical Delta Line at q = 0.1 -->
  <line x1="166.0" y1="134.0" x2="166.0" y2="259.45850182035565" class="ref-line"/>

  <!-- Points and markers -->
  <!-- q = 0.1 -->
  <circle cx="166.0" cy="134.0" r="5.5" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="1.5"/>
  <circle cx="166.0" cy="259.45850182035565" r="5.5" fill="#89b4fa" stroke="#1e1e2e" stroke-width="1.5"/>

  <!-- q = 0.5 -->
  <circle cx="430.0" cy="270.0" r="5.5" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="1.5"/>
  <circle cx="430.0" cy="440.0" r="5.5" fill="#89b4fa" stroke="#1e1e2e" stroke-width="1.5"/>

  <!-- q = 1.0 -->
  <circle cx="760.0" cy="440.0" r="5.5" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="1.5"/>
  <circle cx="760.0" cy="100.0" r="5.5" fill="#89b4fa" stroke="#1e1e2e" stroke-width="1.5"/>

  <!-- Origin (q=0, C=1) -->
  <circle cx="100" cy="100" r="5.5" fill="#cdd6f4" stroke="#1e1e2e" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="100" y1="440" x2="790" y2="440" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="75" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="795" y="445" class="axis-label">q, α</text>
  <text x="90" y="68" class="axis-label" text-anchor="end">C [bit/uso]</text>

  <!-- X Ticks -->
  <text x="100" y="462" class="tick-label" text-anchor="middle">0</text>
  <text x="166.0" y="462" class="tick-label" text-anchor="middle">0.1</text>
  <text x="265.0" y="462" class="tick-label" text-anchor="middle">0.25</text>
  <text x="430.0" y="462" class="tick-label" text-anchor="middle">0.5</text>
  <text x="595.0" y="462" class="tick-label" text-anchor="middle">0.75</text>
  <text x="760" y="462" class="tick-label" text-anchor="middle">1.0</text>

  <!-- Y Ticks -->
  <text x="88" y="444" class="tick-label" text-anchor="end">0</text>
  <text x="88" y="359.0" class="tick-label" text-anchor="end">0.25</text>
  <text x="88" y="274.0" class="tick-label" text-anchor="end">0.50</text>
  <text x="88" y="189.0" class="tick-label" text-anchor="end">0.75</text>
  <text x="88" y="104" class="tick-label" text-anchor="end">1.00</text>

  <!-- Pendenza infinita BSC Callout (q -> 0) -->
  <path d="M 115 120 Q 145 155 175 175" fill="none" stroke="#fab387" stroke-width="1.5" marker-start="url(#arrow-orange)"/>
  <rect x="180" y="158" width="225" height="44" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.2"/>
  <text x="190" y="175" class="callout-title" fill="#fab387">Pendenza infinita a q → 0⁺</text>
  <text x="190" y="192" class="callout-body">dC/dq → -∞ : rumore iniziale critico</text>

  <!-- Delta C Tag at q = 0.1 -->
  <rect x="180.0" y="172.72925091017783" width="190" height="50" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.2"/>
  <text x="188.0" y="188.72925091017783" class="callout-title" fill="#fab387">Gap Informativo a q = α = 0.1</text>
  <text x="188.0" y="204.72925091017783" class="callout-body">C<tspan font-size="9" dy="2">BEC</tspan><tspan dy="-2"> = 0.90  vs  C</tspan><tspan font-size="9" dy="2">BSC</tspan><tspan dy="-2"> = 0.531 bit</tspan></text>
  <text x="188.0" y="216.72925091017783" class="callout-body" fill="#a6e3a1">ΔC = +0.369 bit (+70% efficienza)</text>

  <!-- Legend Box (In Alto a Destra) -->
  <rect x="540" y="80" width="340" height="125" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.2"/>
  <!-- Item 1: BEC -->
  <line x1="555" y1="105" x2="585" y2="105" stroke="#a6e3a1" stroke-width="3.5" stroke-linecap="round"/>
  <text x="595" y="109" class="callout-title" fill="#a6e3a1">C<tspan font-size="10" dy="2">BEC</tspan><tspan dy="-2"> = 1 - α (Canale con Cancellazione)</tspan></text>
  <text x="595" y="123" class="callout-body">Decadimento lineare: ricevitore sa dove manca il dato</text>
  <!-- Item 2: BSC -->
  <line x1="555" y1="145" x2="585" y2="145" stroke="#89b4fa" stroke-width="3.5" stroke-linecap="round"/>
  <text x="595" y="149" class="callout-title" fill="#89b4fa">C<tspan font-size="10" dy="2">BSC</tspan><tspan dy="-2"> = 1 - H<tspan font-size="10" dy="2">B</tspan><tspan dy="-2">(q) (Canale Binario Simmetrico)</tspan></tspan></text>
  <text x="595" y="163" class="callout-body">Decadimento entropico: bit-flip inosservati e insidiosi</text>
  <!-- Item 3: Area Verde -->
  <rect x="555" y="178" width="30" height="15" rx="3" fill="rgba(166, 227, 161, 0.2)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="595" y="190" class="callout-body" fill="#cdd6f4">Vantaggio di localizzazione dell&#39;errore</text>

  <!-- Callout Bottom: Punti Critici a q = 0.5 e q = 1.0 -->
  <rect x="445" y="255" width="215" height="60" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.2"/>
  <text x="455" y="273" class="callout-title" fill="#89b4fa">Punto Critico a q = α = 0.5</text>
  <text x="455" y="291" class="callout-body">• BSC: C = 0 (rumore puro, X ⟂ Y)</text>
  <text x="455" y="305" class="callout-body">• BEC: C = 0.50 (50% bit intatti e noti)</text>

  <rect x="685" y="345" width="215" height="60" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1.2"/>
  <text x="695" y="363" class="callout-title" fill="#cdd6f4">Comportamento a q = α = 1.0</text>
  <text x="695" y="381" class="callout-body">• BSC: C = 1 (inversione deterministica)</text>
  <text x="695" y="395" class="callout-body">• BEC: C = 0 (tutti i bit cancellati)</text>
</svg>