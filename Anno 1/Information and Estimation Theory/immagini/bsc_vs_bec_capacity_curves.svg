<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .axis-line { stroke: #a6adc8; stroke-width: 2; stroke-linecap: round; }
      .grid-line { stroke: #313244; stroke-width: 1; stroke-dasharray: 4 4; }
      .bsc-curve { fill: none; stroke: #89b4fa; stroke-width: 3.5; stroke-linecap: round; }
      .bec-line { fill: none; stroke: #a6e3a1; stroke-width: 3.5; stroke-linecap: round; }
      .gap-area { fill: rgba(166, 227, 161, 0.12); }
      .ref-line { fill: none; stroke: #fab387; stroke-width: 1.8; stroke-dasharray: 4 4; }
      .lead-line { stroke: #9399b2; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #bac2de; text-anchor: middle; }
      .axis-label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #cdd6f4; }
      .tick-label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #a6adc8; }
      .callout-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .callout-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #cdd6f4; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6adc8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fab387"/>
    </marker>
  </defs>

