<svg width="100%" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sens1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sens2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sens3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Sfondo o griglia neutra -->
  <!-- Riquadro 1: Sensore 1 (Basso Rumore) -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="200" height="205" rx="8" fill="#1e293b" fill-opacity="0.05" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#059669">Campione x[0]: Rumore Basso</text>
    <text x="100" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">σ² = 0.5 (Alta precisione)</text>
    <!-- Campana stretta e alta -->
    <path d="M 30 160 Q 90 160 97 70 Q 100 58 103 70 Q 110 160 170 160 Z" fill="url(#sens1Grad)"/>
    <path d="M 30 160 Q 90 160 97 70 Q 100 58 103 70 Q 110 160 170 160" stroke="#10b981" stroke-width="2.2" fill="none"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="100" cy="58" r="3.5" fill="#10b981"/>
    <!-- Peso BLUE -->
    <rect x="25" y="172" width="150" height="24" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="100" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#047857">Peso a₀ = 76.2% (DOMINANTE)</text>
  </g>

  <!-- Riquadro 2: Sensore 2 (Rumore Medio) -->
  <g transform="translate(240, 15)">
    <rect x="0" y="0" width="200" height="205" rx="8" fill="#1e293b" fill-opacity="0.05" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">Campione x[1]: Rumore Medio</text>
    <text x="100" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">σ² = 2.0 (Precisione media)</text>
    <!-- Campana media -->
    <path d="M 20 160 Q 75 160 95 105 Q 100 95 105 105 Q 125 160 180 160 Z" fill="url(#sens2Grad)"/>
    <path d="M 20 160 Q 75 160 95 105 Q 100 95 105 105 Q 125 160 180 160" stroke="#0284c7" stroke-width="2.2" fill="none"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="100" cy="95" r="3.5" fill="#0284c7"/>
    <!-- Peso BLUE -->
    <rect x="25" y="172" width="150" height="24" rx="4" fill="#0284c7" fill-opacity="0.15"/>
    <text x="100" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Peso a₁ = 19.0% (INTERMEDIO)</text>
  </g>

  <!-- Riquadro 3: Sensore 3 (Rumore Alto) -->
  <g transform="translate(465, 15)">
    <rect x="0" y="0" width="200" height="205" rx="8" fill="#1e293b" fill-opacity="0.05" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d97706">Campione x[2]: Rumore Forte</text>
    <text x="100" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">σ² = 8.0 (Bassa precisione)</text>
    <!-- Campana larga e piatta -->
    <path d="M 15 160 Q 60 160 92 135 Q 100 130 108 135 Q 140 160 185 160 Z" fill="url(#sens3Grad)"/>
    <path d="M 15 160 Q 60 160 92 135 Q 100 130 108 135 Q 140 160 185 160" stroke="#d97706" stroke-width="2.2" fill="none"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="100" cy="130" r="3.5" fill="#d97706"/>
    <!-- Peso BLUE -->
    <rect x="25" y="172" width="150" height="24" rx="4" fill="#d97706" fill-opacity="0.15"/>
    <text x="100" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#b45309">Peso a₂ = 4.8% (MARGINALE)</text>
  </g>
</svg>
