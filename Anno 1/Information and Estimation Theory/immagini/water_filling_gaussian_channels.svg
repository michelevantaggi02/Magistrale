<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .axis-line { stroke: #a6adc8; stroke-width: 2; stroke-linecap: round; }
      .grid-line { stroke: #313244; stroke-width: 1; stroke-dasharray: 4 4; }
      .water-line { stroke: #f9e2af; stroke-width: 3; stroke-dasharray: 8 5; }
      .water-fill { fill: #89b4fa; fill-opacity: 0.65; stroke: #b4befe; stroke-width: 2; }
      .noise-fill { fill: #313244; stroke: #585b70; stroke-width: 2; }
      .noise-excess { fill: #45475a; stroke: #f38ba8; stroke-width: 2; stroke-dasharray: 4 3; }
      .label-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; }
      .label-axis { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #bac2de; }
      .label-channel { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #cdd6f4; text-anchor: middle; }
      .label-value { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; }
      .label-water { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f9e2af; }
      .label-off { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f38ba8; text-anchor: middle; }
      .box-bg { fill: #181825; stroke: #45475a; stroke-width: 1.5; rx: 8; }
      .box-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #89b4fa; }
      .box-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #bac2de; }
      .math-font { font-family: "Cambria Math", "DejaVu Serif", "Times New Roman", serif; font-style: italic; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bac2de"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="14" class="bg"/>

  <!-- Title -->
  <text x="430" y="36" class="label-title">Algoritmo di Water-Filling (Riempimento d'Acqua) su Canali Paralleli</text>

  <!-- Coordinate axes -->
  <!-- Origin at (90, 390) -->
  <line x1="90" y1="390" x2="690" y2="390" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="90" y1="390" x2="90" y2="70" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="700" y="395" class="label-axis">Subcanali (j)</text>
  <text x="40" y="65" class="label-axis" text-anchor="middle">Livello</text>
  <text x="40" y="82" class="label-axis" text-anchor="middle">di Potenza</text>

  <!-- Water level nu horizontal line (y = 190) -->
  <line x1="90" y1="190" x2="670" y2="190" class="water-line"/>
  <text x="680" y="195" class="label-water">Soglia ν (Livello dell'acqua)</text>

  <!-- Subchannels: 5 bars centered at X = 160, 260, 360, 460, 560; width = 70 -->
  <!-- Channel 1: Base = 390. Noise floor N1 = 70 (y: 390 down to 320). Water P1 = 130 (y: 320 down to 190). -->
  <!-- Noise 1 -->
  <rect x="125" y="320" width="70" height="70" class="noise-fill"/>
  <!-- Water 1 -->
  <rect x="125" y="190" width="70" height="130" class="water-fill"/>
  <text x="160" y="358" class="label-value">N₁</text>
  <text x="160" y="258" class="label-value" fill="#1e1e2e">P₁*</text>
  <text x="160" y="415" class="label-channel">Canale 1</text>
  <text x="160" y="432" class="box-text" text-anchor="middle" font-size="11px">Rumore minimo</text>

  <!-- Channel 2: Base = 390. Noise floor N2 = 110 (y: 390 down to 280). Water P2 = 90 (y: 280 down to 190). -->
  <!-- Noise 2 -->
  <rect x="225" y="280" width="70" height="110" class="noise-fill"/>
  <!-- Water 2 -->
  <rect x="225" y="190" width="70" height="90" class="water-fill"/>
  <text x="260" y="338" class="label-value">N₂</text>
  <text x="260" y="238" class="label-value" fill="#1e1e2e">P₂*</text>
  <text x="260" y="415" class="label-channel">Canale 2</text>
  <text x="260" y="432" class="box-text" text-anchor="middle" font-size="11px">Rumore moderato</text>

  <!-- Channel 3: Base = 390. Noise floor N3 = 150 (y: 390 down to 240). Water P3 = 50 (y: 240 down to 190). -->
  <!-- Noise 3 -->
  <rect x="325" y="240" width="70" height="150" class="noise-fill"/>
  <!-- Water 3 -->
  <rect x="325" y="190" width="70" height="50" class="water-fill"/>
  <text x="360" y="318" class="label-value">N₃</text>
  <text x="360" y="218" class="label-value" fill="#1e1e2e">P₃*</text>
  <text x="360" y="415" class="label-channel">Canale 3</text>
  <text x="360" y="432" class="box-text" text-anchor="middle" font-size="11px">Rumore medio</text>

  <!-- Channel 4: Base = 390. Noise floor N4 = 180 (y: 390 down to 210). Water P4 = 20 (y: 210 down to 190). -->
  <!-- Noise 4 -->
  <rect x="425" y="210" width="70" height="180" class="noise-fill"/>
  <!-- Water 4 -->
  <rect x="425" y="190" width="70" height="20" class="water-fill"/>
  <text x="460" y="305" class="label-value">N₄</text>
  <text x="460" y="204" class="label-value" font-size="11px" fill="#1e1e2e">P₄*</text>
  <text x="460" y="415" class="label-channel">Canale 4</text>
  <text x="460" y="432" class="box-text" text-anchor="middle" font-size="11px">Poco sopra soglia</text>

  <!-- Channel 5: Base = 390. Noise floor N5 = 250 (y: 390 down to 140). N5 > nu (140 < 190). Water P5 = 0! -->
  <!-- Noise 5 normal part -->
  <rect x="525" y="190" width="70" height="200" class="noise-fill"/>
  <!-- Noise 5 excess part above nu -->
  <rect x="525" y="140" width="70" height="50" class="noise-excess"/>
  <text x="560" y="290" class="label-value">N₅</text>
  <text x="560" y="168" class="label-off">N₅ &gt; ν</text>
  <text x="560" y="415" class="label-channel">Canale 5</text>
  <text x="560" y="432" class="label-off">P₅* = 0 (SPENTO)</text>

  <!-- Side Summary Card on the Right (X = 635, Y = 220, Width = 210, Height = 250) -->
  <rect x="635" y="225" width="205" height="245" class="box-bg"/>
  <text x="648" y="248" class="box-title">Legge Ottima KKT</text>
  <text x="648" y="272" class="label-text" font-weight="700" fill="#a6e3a1">Pⱼ* = (ν - Nⱼ)⁺</text>
  <text x="648" y="292" class="box-text">max(0, ν - Nⱼ)</text>
  
  <line x1="648" y1="305" x2="825" y2="305" stroke="#45475a" stroke-width="1"/>

  <text x="648" y="325" class="box-title">Vincolo di Potenza:</text>
  <text x="648" y="347" class="label-text" font-weight="600" fill="#f9e2af">∑ⱼ (ν - Nⱼ)⁺ = P</text>

  <line x1="648" y1="360" x2="825" y2="360" stroke="#45475a" stroke-width="1"/>

  <text x="648" y="380" class="box-title">Intuizione Operativa:</text>
  <text x="648" y="400" class="box-text">• Più SNR → Più potenza</text>
  <text x="648" y="418" class="box-text">• Nⱼ ≥ ν → Subcanale</text>
  <text x="656" y="434" class="box-text">spento (evita sprechi)</text>
  <text x="648" y="454" class="box-text">• Pⱼ + Nⱼ = ν (costante!)</text>

  <!-- Legend Bottom Left -->
  <g transform="translate(100, 460)">
    <rect x="0" y="0" width="18" height="14" class="water-fill"/>
    <text x="26" y="11" class="box-text">Potenza trasmessa Pⱼ*</text>
    
    <rect x="180" y="0" width="18" height="14" class="noise-fill"/>
    <text x="206" y="11" class="box-text">Varianza rumore Nⱼ</text>
    
    <rect x="340" y="0" width="18" height="14" class="noise-excess"/>
    <text x="366" y="11" class="box-text">Rumore oltre soglia (Deep Fade)</text>
  </g>
</svg>
