<svg width="100%" height="220" viewBox="0 0 650 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sharpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Pannello Sinistro: Alta Informazione -->
  <g transform="translate(10, 10)">
    <!-- Assi -->
    <line x1="40" y1="160" x2="280" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="40" y1="160" x2="40" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Frecce -->
    <polygon points="280,160 273,156 273,164" fill="#94a3b8" fill-opacity="0.8"/>
    <polygon points="40,20 36,27 44,27" fill="#94a3b8" fill-opacity="0.8"/>
    <!-- Etichette Assi -->
    <text x="270" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">θ</text>
    <text x="12" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">ln f</text>
    <!-- Curva Aguzza -->
    <path d="M 60 160 Q 150 160 155 45 Q 160 35 165 45 Q 170 160 260 160 Z" fill="url(#sharpGrad)"/>
    <path d="M 60 160 Q 150 160 155 45 Q 160 35 165 45 Q 170 160 260 160" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <!-- Massimo -->
    <circle cx="160" cy="35" r="4" fill="#38bdf8"/>
    <!-- Titolo e Spiegazione -->
    <text x="160" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8">Picco Aguzzo (Alta Informazione)</text>
    <text x="160" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Forte curvatura negativa: θ ben discriminato</text>
  </g>

  <!-- Pannello Destro: Bassa Informazione -->
  <g transform="translate(340, 10)">
    <!-- Assi -->
    <line x1="40" y1="160" x2="280" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="40" y1="160" x2="40" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Frecce -->
    <polygon points="280,160 273,156 273,164" fill="#94a3b8" fill-opacity="0.8"/>
    <polygon points="40,20 36,27 44,27" fill="#94a3b8" fill-opacity="0.8"/>
    <!-- Etichette Assi -->
    <text x="270" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">θ</text>
    <text x="12" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">ln f</text>
    <!-- Curva Piatta -->
    <path d="M 60 160 Q 100 160 130 110 Q 160 95 190 110 Q 220 160 260 160 Z" fill="url(#flatGrad)"/>
    <path d="M 60 160 Q 100 160 130 110 Q 160 95 190 110 Q 220 160 260 160" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <!-- Massimo -->
    <circle cx="160" cy="95" r="4" fill="#f59e0b"/>
    <!-- Titolo e Spiegazione -->
    <text x="160" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#f59e0b">Profilo Piatto (Bassa Informazione)</text>
    <text x="160" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Debole curvatura: stima intrinsecamente incerta</text>
  </g>
</svg>
