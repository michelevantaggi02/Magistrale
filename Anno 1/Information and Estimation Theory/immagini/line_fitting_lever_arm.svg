<svg width="100%" height="230" viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Assi Cartesiani -->
  <line x1="50" y1="180" x2="540" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <line x1="50" y1="180" x2="50" y2="25" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.8" marker-end="url(#arrow)"/>
  <text x="545" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">n</text>
  <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#94a3b8">x[n]</text>

  <!-- Retta Stimata di Regressione -->
  <line x1="50" y1="150" x2="500" y2="50" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Campioni con rumore attorno alla retta -->
  <circle cx="50" cy="150" r="4.5" fill="#38bdf8"/>
  <circle cx="110" cy="138" r="4.5" fill="#38bdf8"/>
  <circle cx="170" cy="120" r="4.5" fill="#38bdf8"/>
  <circle cx="230" cy="112" r="4.5" fill="#38bdf8"/>
  <circle cx="300" cy="95" r="4.5" fill="#38bdf8"/>
  <circle cx="370" cy="82" r="4.5" fill="#38bdf8"/>
  <circle cx="430" cy="65" r="4.5" fill="#38bdf8"/>
  <circle cx="490" cy="52" r="6.5" fill="#ef4444"/> <!-- Campione con leva massima -->

  <!-- Braccio di Leva -->
  <line x1="50" y1="198" x2="490" y2="198" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="198" x2="50" y2="198" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="270" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Braccio di Leva Temporale L ≈ N</text>

  <!-- Linea tratteggiata di riferimento a N-1 -->
  <line x1="490" y1="180" x2="490" y2="52" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.6"/>
  <text x="490" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">N-1</text>
  <text x="50" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">0</text>

  <!-- Spiegazione Angolare -->
  <text x="380" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">Campione a n = N-1</text>
  <text x="380" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Δθ₂ ≈ Δx / N → Varianza O(1/N³)</text>
</svg>
