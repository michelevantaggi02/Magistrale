<svg width="100%" height="230" viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Sfondo bianco per stampa e contrasto ottimale -->
  <rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Assi Cartesiani -->
  <line x1="50" y1="175" x2="550" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="175" x2="50" y2="25" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#0f172a">n</text>
  <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#0f172a">x[n]</text>

  <!-- Retta Stimata di Regressione -->
  <line x1="50" y1="145" x2="500" y2="45" stroke="#059669" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Campioni con rumore attorno alla retta -->
  <circle cx="50" cy="145" r="4.5" fill="#0284c7"/>
  <circle cx="110" cy="133" r="4.5" fill="#0284c7"/>
  <circle cx="170" cy="115" r="4.5" fill="#0284c7"/>
  <circle cx="230" cy="107" r="4.5" fill="#0284c7"/>
  <circle cx="300" cy="90" r="4.5" fill="#0284c7"/>
  <circle cx="370" cy="77" r="4.5" fill="#0284c7"/>
  <circle cx="430" cy="60" r="4.5" fill="#0284c7"/>
  <circle cx="490" cy="47" r="6.5" fill="#dc2626"/> <!-- Campione con leva massima -->

  <!-- Braccio di Leva -->
  <line x1="50" y1="195" x2="490" y2="195" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="490" y1="195" x2="50" y2="195" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="270" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">Braccio di Leva Temporale L ≈ N</text>

  <!-- Linea tratteggiata di riferimento a N-1 -->
  <line x1="490" y1="175" x2="490" y2="47" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.7"/>
  <text x="490" y="167" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">N-1</text>
  <text x="50" y="167" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">0</text>

  <!-- Scheda Callout Spiegazione Angolare -->
  <rect x="360" y="15" width="220" height="42" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="370" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Campione a n = N-1</text>
  <text x="370" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Δθ₂ ≈ Δx / N → Varianza O(1/N³)</text>
</svg>