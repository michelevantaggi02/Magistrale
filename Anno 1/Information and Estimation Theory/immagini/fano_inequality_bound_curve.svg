<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .axis-line { stroke: #a6adc8; stroke-width: 2; stroke-linecap: round; }
      .grid-line { stroke: #313244; stroke-width: 1; stroke-dasharray: 4 4; }
      .fano-curve { fill: none; stroke: #89b4fa; stroke-width: 3.5; stroke-linecap: round; }
      .linear-bound { fill: none; stroke: #f38ba8; stroke-width: 2.5; stroke-dasharray: 6 4; }
      .threshold-line { fill: none; stroke: #fab387; stroke-width: 2; stroke-dasharray: 4 4; }
      .region-forbidden { fill: rgba(243, 139, 168, 0.12); }
      .region-achievable { fill: rgba(166, 227, 161, 0.08); }
      .label-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; }
      .label-axis { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #bac2de; }
      .label-tick { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #a6adc8; text-anchor: middle; }
      .label-tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .legend-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cdd6f4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bac2de"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="500" rx="12" class="bg"/>

  <!-- Title -->
  <text x="420" y="36" class="label-title">Disuguaglianza di Fano: Limiti sull'Entropia Condizionata Residua H(X|Y)</text>

  <!-- Axes origin: (100, 420), width: 660, height: 350 -> X end: (760, 420), Y end: (100, 70) -->
  <!-- Grid Lines -->
  <line x1="100" y1="337" x2="740" y2="337" class="grid-line"/>
  <line x1="100" y1="254" x2="740" y2="254" class="grid-line"/>
  <line x1="100" y1="171" x2="740" y2="171" class="grid-line"/>
  <line x1="100" y1="88" x2="740" y2="88" class="grid-line"/>

  <line x1="260" y1="420" x2="260" y2="70" class="grid-line"/>
  <line x1="420" y1="420" x2="420" y2="70" class="grid-line"/>
  <line x1="580" y1="420" x2="580" y2="70" class="grid-line"/>

  <!-- Shaded Regions: Forbidden vs Achievable -->
  <!-- Upper region is Forbidden (H(X|Y) cannot exceed Fano curve for a given Pe) -->
  <path d="M 100 420 
           C 115 280, 150 200, 220 160 
           C 300 120, 440 95, 580 88 
           L 580 70 L 100 70 Z" class="region-forbidden"/>

  <!-- Fano Upper Bound Curve: H_B(Pe) + Pe*log2(M-1) for M=8 (log2(M)=3, log2(M-1)=2.807) -->
  <!-- Points calculated for M=8:
       Pe = 0    -> H = 0 (100, 420)
       Pe = 0.05 -> H = 0.286 + 0.140 = 0.426 -> y = 420 - (0.426/3)*332 = 373
       Pe = 0.1  -> H = 0.469 + 0.281 = 0.750 -> y = 337
       Pe = 0.2  -> H = 0.722 + 0.561 = 1.283 -> y = 278
       Pe = 0.3  -> H = 0.881 + 0.842 = 1.723 -> y = 229
       Pe = 0.5  -> H = 1.000 + 1.404 = 2.404 -> y = 154
       Pe = 0.7  -> H = 0.881 + 1.965 = 2.846 -> y = 105
       Pe = 0.875 (1 - 1/M) -> H = log2(8) = 3.000 -> (580, 88)
  -->
  <path d="M 100 420 
           Q 115 320, 150 278 
           T 260 195 
           T 420 135 
           T 580 88" class="fano-curve"/>

  <!-- Linear Weakened Bound: 1 + Pe*log2(M) -->
  <!-- Pe = 0 -> H = 1 (100, 310)
       Pe = 0.667 -> H = 3 (526, 88)
  -->
  <line x1="100" y1="310" x2="526" y2="88" class="linear-bound"/>

  <!-- Critical Threshold H(X|Y) = 1 bit -->
  <line x1="100" y1="310" x2="740" y2="310" class="threshold-line"/>
  <circle cx="100" cy="310" r="5" fill="#fab387"/>

  <!-- Maximum entropy point (1 - 1/M, log2 M) -->
  <circle cx="580" cy="88" r="6" fill="#89b4fa"/>
  <circle cx="100" cy="420" r="5" fill="#a6e3a1"/>

  <!-- Axes -->
  <line x1="100" y1="420" x2="750" y2="420" class="axis-line" marker-end="url(#arrow)"/>
  <line x1="100" y1="420" x2="100" y2="60" class="axis-line" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="755" y="445" class="label-axis">P<tspan dy="3" font-size="11">e</tspan><tspan dy="-3"> = Pr{X̂ ≠ X}</tspan></text>
  <text x="40" y="65" class="label-axis">H(X|Y) [bit]</text>

  <!-- Ticks on X -->
  <text x="100" y="440" class="label-tick">0</text>
  <text x="260" y="440" class="label-tick">0.25</text>
  <text x="420" y="440" class="label-tick">0.50</text>
  <text x="580" y="440" class="label-tick">1 - 1/|𝒳|</text>

  <!-- Ticks on Y -->
  <text x="80" y="424" class="label-tick">0</text>
  <text x="80" y="314" class="label-tick">1</text>
  <text x="80" y="200" class="label-tick">2</text>
  <text x="75" y="92" class="label-tick">log₂|𝒳|</text>

  <!-- Annotations on Graph -->
  <!-- Critical insight: Pe > 0 if H(X|Y) > 1 -->
  <rect x="110" y="325" width="220" height="42" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.2"/>
  <text x="120" y="343" class="label-tag" fill="#fab387">Soglia Critica H(X|Y) &gt; 1</text>
  <text x="120" y="358" font-family="system-ui" font-size="11" fill="#cdd6f4">Impossibile avere P<tspan dy="2" font-size="9">e</tspan><tspan dy="-2"> = 0</tspan></text>

  <!-- Region Labels -->
  <text x="230" y="115" class="label-tag" fill="#f38ba8" opacity="0.9">REGIONE PROIBITA (Non realizzabile)</text>
  <text x="480" y="280" class="label-tag" fill="#a6e3a1" opacity="0.9">REGIONE AMMISSIBILE</text>

  <!-- Curve tags -->
  <text x="350" y="165" class="label-tag" fill="#89b4fa">H<tspan dy="2" font-size="10">B</tspan><tspan dy="-2">(P</tspan><tspan dy="2" font-size="10">e</tspan><tspan dy="-2">) + P</tspan><tspan dy="2" font-size="10">e</tspan><tspan dy="-2"> log₂(|𝒳| - 1)</tspan></text>
  <text x="270" y="235" class="label-tag" fill="#f38ba8">1 + P<tspan dy="2" font-size="10">e</tspan><tspan dy="-2"> log₂|𝒳|</tspan> (Limite lineare indebolito)</text>

  <!-- Legend Box -->
  <rect x="530" y="320" width="280" height="85" rx="8" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <line x1="545" y1="340" x2="575" y2="340" stroke="#89b4fa" stroke-width="3"/>
  <text x="585" y="344" class="legend-text">Limite esatto di Fano</text>

  <line x1="545" y1="362" x2="575" y2="362" stroke="#f38ba8" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="585" y="366" class="legend-text">Limite lineare rilassato</text>

  <line x1="545" y1="384" x2="575" y2="384" stroke="#fab387" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="585" y="388" class="legend-text">Soglia d'errore certo (1 bit)</text>
</svg>
