<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .stem-active { stroke: #7c3aed; stroke-width: 2.5; stroke-linecap: round; }
      .marker-active { fill: #7c3aed; stroke: #6d28d9; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #7c3aed; text-anchor: middle; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .text-tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- Titolo -->
  <text x="170" y="24" class="text-title">Sequenza Mista (Non Causale)</text>
  <text x="170" y="42" class="text-sub">h(n) ≠ 0 sia per n &lt; 0 che per n &gt; 0</text>

  <!-- Asse Orizzontale (n) -->
  <line x1="20" y1="140" x2="315" y2="140" class="axis" />
  <polyline points="308,136 315,140 308,144" fill="none" class="axis" />
  <text x="320" y="144" class="text-axis">n</text>

  <!-- Asse Verticale (h(n)) at n = 0 (x = 170) -->
  <line x1="170" y1="180" x2="170" y2="60" class="axis" />
  <polyline points="166,67 170,60 174,67" fill="none" class="axis" />
  <text x="170" y="52" class="text-axis" text-anchor="middle">d(k)</text>

  <!-- n = -4 (x = 74), h = -12 px -> y = 152 (negativo) -->
  <line x1="74" y1="140" x2="74" y2="152" class="stem-active" />
  <circle cx="74" cy="152" r="3.5" class="marker-active" />
  <text x="74" y="132" class="text-tick">-4</text>

  <!-- n = -3 (x = 98), h = 18 px -> y = 122 -->
  <line x1="98" y1="140" x2="98" y2="122" class="stem-active" />
  <circle cx="98" cy="122" r="3.5" class="marker-active" />
  <text x="98" y="156" class="text-tick">-3</text>

  <!-- n = -2 (x = 122), h = -25 px -> y = 165 (negativo) -->
  <line x1="122" y1="140" x2="122" y2="165" class="stem-active" />
  <circle cx="122" cy="165" r="4" class="marker-active" />
  <text x="122" y="132" class="text-tick">-2</text>

  <!-- n = -1 (x = 146), h = 48 px -> y = 92 -->
  <line x1="146" y1="140" x2="146" y2="92" class="stem-active" />
  <circle cx="146" cy="92" r="4.5" class="marker-active" />
  <text x="146" y="156" class="text-tick">-1</text>

  <!-- n = 0 (x = 170), h = 70 px -> y = 70 -->
  <line x1="170" y1="140" x2="170" y2="70" class="stem-active" />
  <circle cx="170" cy="70" r="5" class="marker-active" />
  <text x="170" y="156" class="text-tick" font-weight="bold">0</text>

  <!-- n = 1 (x = 194), h = 48 px -> y = 92 -->
  <line x1="194" y1="140" x2="194" y2="92" class="stem-active" />
  <circle cx="194" cy="92" r="4.5" class="marker-active" />
  <text x="194" y="156" class="text-tick">1</text>

  <!-- n = 2 (x = 218), h = -25 px -> y = 165 -->
  <line x1="218" y1="140" x2="218" y2="165" class="stem-active" />
  <circle cx="218" cy="165" r="4" class="marker-active" />
  <text x="218" y="132" class="text-tick">2</text>

  <!-- n = 3 (x = 242), h = 18 px -> y = 122 -->
  <line x1="242" y1="140" x2="242" y2="122" class="stem-active" />
  <circle cx="242" cy="122" r="3.5" class="marker-active" />
  <text x="242" y="156" class="text-tick">3</text>

  <!-- n = 4 (x = 266), h = -12 px -> y = 152 -->
  <line x1="266" y1="140" x2="266" y2="152" class="stem-active" />
  <circle cx="266" cy="152" r="3.5" class="marker-active" />
  <text x="266" y="132" class="text-tick">4</text>

  <!-- Indicatore zona bilaterale -->
  <rect x="70" y="176" width="200" height="22" rx="4" fill="#7c3aed" fill-opacity="0.1" />
  <text x="170" y="191" class="text-sub">Supporto Bilatero / Misto (Sinc Ideale)</text>
</svg>