<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #334155; stroke-width: 1.8; fill: none; }
      .wire-dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .box-filter { fill: #f8fafc; stroke: #0284c7; stroke-width: 1.8; rx: 6px; }
      .box-sum { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-filter { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0369a1; text-anchor: middle; }
      .text-filter-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
      .text-signal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .node-dot { fill: #0f172a; }
      .spec-h1 { stroke: #0284c7; stroke-width: 2.2; fill: none; }
      .spec-h2 { stroke: #d97706; stroke-width: 2.2; fill: none; }
      .spec-hm { stroke: #7c3aed; stroke-width: 2.2; fill: none; }
      .spec-sum { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 5,4; fill: none; }
    </style>
  </defs>

  <!-- ================= PARTE 1: SCHEMA A BLOCCHI ================= -->

  <!-- Ingresso x(n) -->
  <text x="35" y="115" class="text-label">x(n)</text>
  <line x1="70" y1="110" x2="110" y2="110" class="wire" />
  <circle cx="110" cy="110" r="3.5" class="node-dot" />

  <!-- Bus di distribuzione verticale -->
  <line x1="110" y1="50" x2="110" y2="170" class="wire" />

  <!-- Ramo 1: Filtro Passa-Basso h1(n) -->
  <line x1="110" y1="50" x2="150" y2="50" class="wire" />
  <polyline points="144,46 150,50 144,54" fill="none" class="wire" />
  <rect x="150" y="25" width="160" height="50" class="box-filter" />
  <text x="230" y="46" class="text-filter">Filtro h₁(n)</text>
  <text x="230" y="62" class="text-filter-sub">Passa-Basso (Banda 1)</text>

  <!-- Segnale sottobanda x1(n) -->
  <line x1="310" y1="50" x2="470" y2="50" class="wire" />
  <polyline points="464,46 470,50 464,54" fill="none" class="wire" />
  <text x="375" y="42" class="text-signal" text-anchor="middle">x₁(n)</text>

  <!-- Ramo 2: Filtro Passa-Banda h2(n) -->
  <line x1="110" y1="110" x2="150" y2="110" class="wire" />
  <polyline points="144,106 150,110 144,114" fill="none" class="wire" />
  <rect x="150" y="85" width="160" height="50" class="box-filter" />
  <text x="230" y="106" class="text-filter">Filtro h₂(n)</text>
  <text x="230" y="122" class="text-filter-sub">Passa-Banda (Banda 2)</text>

  <!-- Segnale sottobanda x2(n) -->
  <line x1="310" y1="110" x2="470" y2="110" class="wire" />
  <polyline points="464,106 470,110 464,114" fill="none" class="wire" />
  <text x="375" y="102" class="text-signal" text-anchor="middle">x₂(n)</text>

  <!-- Puntini di sospensione verticali -->
  <text x="230" y="150" font-size="16" fill="#64748b" text-anchor="middle" font-weight="bold">⋮</text>
  <text x="375" y="148" font-size="16" fill="#64748b" text-anchor="middle" font-weight="bold">⋮</text>

  <!-- Ramo M: Filtro Passa-Alto hM(n) -->
  <line x1="110" y1="170" x2="150" y2="170" class="wire" />
  <polyline points="144,166 150,170 144,174" fill="none" class="wire" />
  <rect x="150" y="145" width="160" height="50" class="box-filter" />
  <text x="230" y="166" class="text-filter">Filtro h_M(n)</text>
  <text x="230" y="182" class="text-filter-sub">Passa-Alto (Banda M)</text>

  <!-- Segnale sottobanda xM(n) -->
  <line x1="310" y1="170" x2="470" y2="170" class="wire" />
  <polyline points="464,166 470,170 464,174" fill="none" class="wire" />
  <text x="375" y="162" class="text-signal" text-anchor="middle">x_M(n)</text>

  <!-- Bus di raccolta al Sommatore -->
  <line x1="470" y1="50" x2="470" y2="170" class="wire" />
  <circle cx="470" cy="110" r="3.5" class="node-dot" />
  <line x1="470" y1="110" x2="520" y2="110" class="wire" />
  <polyline points="514,106 520,110 514,114" fill="none" class="wire" />

  <!-- Sommatore -->
  <circle cx="540" cy="110" r="20" class="box-sum" />
  <text x="540" y="117" font-family="sans-serif" font-size="20" font-weight="bold" fill="#16a34a" text-anchor="middle">∑</text>

  <!-- Uscita Ricostruita -->
  <line x1="560" y1="110" x2="620" y2="110" class="wire" />
  <polyline points="614,106 620,110 614,114" fill="none" class="wire" />
  <text x="630" y="105" class="text-label">x̂(n) = ∑ x_i(n)</text>
  <text x="630" y="122" font-size="11" fill="#16a34a" font-weight="600">= x(n - M)</text>

  <!-- Separatore orizzontale tratteggiato -->
  <line x1="40" y1="210" x2="720" y2="210" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,4" />

  <!-- ================= PARTE 2: SPETTRO COMPLEMENTARE ================= -->

  <!-- Asse orizzontale frequenza -->
  <line x1="100" y1="315" x2="680" y2="315" stroke="#475569" stroke-width="1.5" />
  <polyline points="674,311 680,315 674,319" fill="none" stroke="#475569" stroke-width="1.5" />
  <text x="688" y="319" class="text-axis">f</text>

  <!-- Asse verticale ampiezza -->
  <line x1="100" y1="315" x2="100" y2="235" stroke="#475569" stroke-width="1.5" />
  <polyline points="96,241 100,235 104,241" fill="none" stroke="#475569" stroke-width="1.5" />
  <text x="85" y="238" class="text-axis" text-anchor="middle">|H(f)|</text>
  <text x="85" y="260" class="text-axis" font-size="10" text-anchor="middle">1.0</text>
  <line x1="96" y1="256" x2="100" y2="256" stroke="#475569" stroke-width="1.5" />

  <!-- Linea ideale somma = 1 (tratteggiata verde) -->
  <line x1="100" y1="256" x2="660" y2="256" class="spec-sum" />
  <text x="590" y="248" font-size="10" font-weight="600" fill="#16a34a">Somma = 1 (Ricostruzione Perfetta)</text>

  <!-- Curva Passa-Basso |H1(f)|: flat da 100 a 220, transizione da 220 a 270 verso 315 -->
  <path d="M 100,256 L 220,256 C 245,256 250,315 275,315" class="spec-h1" />
  <text x="170" y="278" font-size="11" font-weight="bold" fill="#0284c7">|H₁(f)|</text>

  <!-- Curva Passa-Banda |H2(f)|: sale da 220 a 270, flat fino a 370, scende verso 420 -->
  <path d="M 220,315 C 245,315 250,256 275,256 L 370,256 C 395,256 400,315 425,315" class="spec-h2" />
  <text x="325" y="278" font-size="11" font-weight="bold" fill="#d97706">|H₂(f)|</text>

  <!-- Punti tratteggiati per bande intermedie -->
  <text x="455" y="280" font-size="14" fill="#64748b" text-anchor="middle">⋯</text>

  <!-- Curva Passa-Alto |HM(f)|: sale da 490 a 540, flat fino a 660 -->
  <path d="M 490,315 C 515,315 520,256 545,256 L 660,256" class="spec-hm" />
  <text x="600" y="278" font-size="11" font-weight="bold" fill="#7c3aed">|H_M(f)|</text>

  <!-- Tick di frequenza su asse f -->
  <text x="100" y="332" class="text-axis" text-anchor="middle">0</text>
  <line x1="247" y1="315" x2="247" y2="320" stroke="#475569" stroke-width="1" />
  <text x="247" y="332" class="text-axis" text-anchor="middle">f₁</text>
  <line x1="397" y1="315" x2="397" y2="320" stroke="#475569" stroke-width="1" />
  <text x="397" y="332" class="text-axis" text-anchor="middle">f₂</text>
  <line x1="517" y1="315" x2="517" y2="320" stroke="#475569" stroke-width="1" />
  <text x="517" y="332" class="text-axis" text-anchor="middle">f_{M-1}</text>
  <line x1="660" y1="315" x2="660" y2="320" stroke="#475569" stroke-width="1" />
  <text x="660" y="332" class="text-axis" text-anchor="middle">f_s / 2</text>
</svg>