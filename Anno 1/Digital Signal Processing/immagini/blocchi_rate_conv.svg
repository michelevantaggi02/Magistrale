<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      
      .box-expand { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; rx: 6px; }
      .box-filter1 { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; rx: 6px; }
      .box-filter2 { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 6px; }
      .box-down { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.8; rx: 6px; }
      .box-unified { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 8px; }
      
      .wire { stroke: #334155; stroke-width: 1.8; fill: none; }
      .wire-sub { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4,3; }
      
      .label-block-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .label-block-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 500; text-anchor: middle; }
      .label-signal { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .label-rate { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
      
      .group-box { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5,4; rx: 8px; }
      .group-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      
      .axis { stroke: #475569; stroke-width: 1.3; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-style: italic; fill: #334155; }
      .tick-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
      
      .anno-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 6px; }
      .anno-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .anno-bold { font-weight: 700; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-axis" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="840" height="470" class="bg" />

  <!-- Header -->
  <text x="28" y="38" class="title">Architettura del Convertitore di Frequenza di Campionamento (Sample Rate Converter)</text>
  <text x="28" y="58" class="subtitle">Dalla cascata di interpolatore e decimatore alla semplificazione in un unico filtro a banda più stretta</text>

  <!-- ==================== SEZIONE 1: CASCATA DI 4 BLOCCHI ==================== -->
  <text x="30" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">1. Cascata separata: Interpolatore (↑ L) e Decimatore (↓ M)</text>
  
  <!-- Group container for the two filters -->
  <rect x="235" y="110" width="385" height="110" class="group-box" />
  <rect x="245" y="100" width="250" height="20" fill="#f8fafc" />
  <text x="250" y="114" class="group-tag">Operano alla stessa frequenza intermedia f<tspan baseline-shift="sub" font-size="75%">s</tspan>' = L · f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>

  <!-- Input x(n) -->
  <line x1="30" y1="160" x2="95" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="60" y="150" class="label-signal">x(n)</text>
  <text x="60" y="178" class="label-rate">rate f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>

  <!-- Block 1: Upsampler ↑ L -->
  <rect x="95" y="135" width="95" height="50" class="box-expand" />
  <text x="142" y="158" class="label-block-title" fill="#16a34a">↑ L</text>
  <text x="142" y="174" class="label-block-sub" fill="#15803d">Upsampler</text>

  <!-- Wire 1 -> Filter 1 -->
  <line x1="190" y1="160" x2="255" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="222" y="150" class="label-signal">v(n')</text>
  <text x="222" y="178" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>' = L f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>

  <!-- Block 2: Interpolation filter (cutoff pi / L) -->
  <rect x="255" y="130" width="155" height="60" class="box-filter1" />
  <text x="332" y="152" class="label-block-title" fill="#0891b2">Filtro Interpolatore</text>
  <text x="332" y="168" class="label-block-sub" fill="#0e7490">H<tspan baseline-shift="sub" font-size="75%">1</tspan>(ω) con ω<tspan baseline-shift="sub" font-size="75%">c1</tspan> = π / L</text>
  <text x="332" y="182" class="label-block-sub" fill="#0e7490">Guadagno = L (anti-imaging)</text>

  <!-- Wire Filter 1 -> Filter 2 -->
  <line x1="410" y1="160" x2="455" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="432" y="178" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>'</text>

  <!-- Block 3: Decimation filter (cutoff pi / M) -->
  <rect x="455" y="130" width="155" height="60" class="box-filter2" />
  <text x="532" y="152" class="label-block-title" fill="#dc2626">Filtro Decimatore</text>
  <text x="532" y="168" class="label-block-sub" fill="#b91c1c">H<tspan baseline-shift="sub" font-size="75%">2</tspan>(ω) con ω<tspan baseline-shift="sub" font-size="75%">c2</tspan> = π / M</text>
  <text x="532" y="182" class="label-block-sub" fill="#b91c1c">Guadagno = 1 (anti-aliasing)</text>

  <!-- Wire Filter 2 -> Downsampler -->
  <line x1="610" y1="160" x2="655" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="632" y="150" class="label-signal">w(n')</text>
  <text x="632" y="178" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>'</text>

  <!-- Block 4: Downsampler ↓ M -->
  <rect x="655" y="135" width="95" height="50" class="box-down" />
  <text x="702" y="158" class="label-block-title" fill="#9333ea">↓ M</text>
  <text x="702" y="174" class="label-block-sub" fill="#7e22ce">Downsampler</text>

  <!-- Output y(m) -->
  <line x1="750" y1="160" x2="825" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="788" y="150" class="label-signal">y(m)</text>
  <text x="788" y="178" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>'' = (L/M) f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>


  <!-- ==================== FREQUENCY MOTIVATION & SIMPLIFICATION ==================== -->
  <!-- Arrow down indicating combination -->
  <path d="M 432 225 L 432 270" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-orange)" />
  
  <!-- Spectral Multiplication Mini-Graph on the left -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="285" height="95" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="12" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">Prodotto in frequenza: H(ω) = H<tspan baseline-shift="sub" font-size="75%">1</tspan>(ω) · H<tspan baseline-shift="sub" font-size="75%">2</tspan>(ω)</text>
    
    <!-- Mini frequency axis -->
    <line x1="25" y1="75" x2="265" y2="75" class="axis" marker-end="url(#arrow-axis)" />
    <text x="270" y="78" class="axis-label">ω</text>
    <line x1="40" y1="75" x2="40" y2="28" class="axis" />
    <text x="32" y="78" class="tick-text">0</text>
    
    <!-- Filter 1: cutoff pi/L (wider, cyan/blue) -->
    <polyline points="40,42 165,42 165,75" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <text x="165" y="88" class="tick-text" fill="#0891b2">π / L</text>
    
    <!-- Filter 2: cutoff pi/M (narrower, red) -->
    <polyline points="40,42 115,42 115,75" stroke="#dc2626" stroke-width="1.5" fill="none" />
    <text x="115" y="88" class="tick-text" fill="#dc2626">π / M</text>
    
    <!-- Overlap shaded: amber -->
    <rect x="40" y="42" width="75" height="33" fill="#f59e0b" fill-opacity="0.35" />
    <text x="185" y="48" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#b45309">Rimane solo il più stretto:</text>
    <text x="185" y="62" font-family="sans-serif" font-size="9" fill="#78350f">ω<tspan baseline-shift="sub" font-size="75%">c</tspan> = min(π/L, π/M)</text>
  </g>

  <!-- Text explanation on the right -->
  <g transform="translate(470, 245)">
    <rect x="0" y="0" width="355" height="85" class="anno-box" />
    <text x="15" y="22" class="anno-text"><tspan class="anno-bold" fill="#d97706">Fusione dei due filtri digitali:</tspan></text>
    <text x="15" y="40" class="anno-text">Essendo posti in cascata alla stessa frequenza f<tspan baseline-shift="sub" font-size="75%">s</tspan>',</text>
    <text x="15" y="56" class="anno-text">le funzioni di trasferimento si moltiplicano H(ω) = H<tspan baseline-shift="sub" font-size="75%">1</tspan>(ω) · H<tspan baseline-shift="sub" font-size="75%">2</tspan>(ω).</text>
    <text x="15" y="72" class="anno-text">Basta implementare un <tspan font-weight="bold" fill="#1e293b">singolo filtro FIR</tspan> a banda minima!</text>
  </g>

  <!-- ==================== SEZIONE 2: ARCHITETTURA UNIFICATA ==================== -->
  <text x="30" y="370" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">2. Architettura unificata equivalente (Singolo filtro)</text>

  <!-- Input x(n) -->
  <line x1="50" y1="425" x2="150" y2="425" class="wire" marker-end="url(#arrow)" />
  <text x="100" y="415" class="label-signal">x(n)</text>
  <text x="100" y="443" class="label-rate">rate f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>

  <!-- Block 1: Upsampler ↑ L -->
  <rect x="150" y="398" width="105" height="54" class="box-expand" />
  <text x="202" y="422" class="label-block-title" fill="#16a34a">↑ L</text>
  <text x="202" y="439" class="label-block-sub" fill="#15803d">Upsampler</text>

  <!-- Wire 1 -> Unified Filter -->
  <line x1="255" y1="425" x2="340" y2="425" class="wire" marker-end="url(#arrow)" />
  <text x="297" y="415" class="label-signal">v(n')</text>
  <text x="297" y="443" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>' = L f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>

  <!-- Block 2: Single Unified Digital Filter -->
  <rect x="340" y="390" width="250" height="70" class="box-unified" />
  <text x="465" y="414" class="label-block-title" fill="#b45309">Filtro Unico H(ω) (FIR)</text>
  <text x="465" y="432" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">ω<tspan baseline-shift="sub" font-size="75%">c</tspan> = min(π/L, π/M) = π / max(L, M)</text>
  <text x="465" y="449" class="label-block-sub" fill="#92400e">Guadagno = L (frequenza f<tspan baseline-shift="sub" font-size="75%">s</tspan>' = L f<tspan baseline-shift="sub" font-size="75%">s</tspan>)</text>

  <!-- Wire Unified Filter -> Downsampler -->
  <line x1="590" y1="425" x2="675" y2="425" class="wire" marker-end="url(#arrow)" />
  <text x="632" y="415" class="label-signal">w(n')</text>
  <text x="632" y="443" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>'</text>

  <!-- Block 3: Downsampler ↓ M -->
  <rect x="675" y="398" width="105" height="54" class="box-down" />
  <text x="727" y="422" class="label-block-title" fill="#9333ea">↓ M</text>
  <text x="727" y="439" class="label-block-sub" fill="#7e22ce">Downsampler</text>

  <!-- Output y(m) -->
  <line x1="780" y1="425" x2="845" y2="425" class="wire" marker-end="url(#arrow)" />
  <text x="812" y="415" class="label-signal">y(m)</text>
  <text x="812" y="443" class="label-rate">f<tspan baseline-shift="sub" font-size="75%">s</tspan>'' = (L/M) f<tspan baseline-shift="sub" font-size="75%">s</tspan></text>
</svg>