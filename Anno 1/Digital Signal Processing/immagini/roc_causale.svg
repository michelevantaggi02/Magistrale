<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-dasharray: 4,4; stroke-width: 1; }
      .unit-circle { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
      .pole-circle { stroke: #059669; stroke-width: 1.5; fill: none; }
      .roc { fill: #10b981; fill-opacity: 0.25; fill-rule: evenodd; }
      .pole-mark { stroke: #dc2626; stroke-width: 2.5; stroke-linecap: round; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #047857; text-anchor: middle; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .label-blue { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1d4ed8; }
      .label-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>

  <!-- Sfondo ROC (Esterno a |z| = |p| = 60 px) -->
  <path class="roc" d="M 20,40 L 400,40 L 400,400 L 20,400 Z M 210,220 m -65,0 a 65,65 0 1,0 130,0 a 65,65 0 1,0 -130,0 Z" />

  <!-- Assi Cartesiani (Re, Im) -->
  <line x1="30" y1="220" x2="390" y2="220" class="axis" />
  <polyline points="383,216 390,220 383,224" fill="none" class="axis" />
  <line x1="210" y1="390" x2="210" y2="50" class="axis" />
  <polyline points="206,57 210,50 214,57" fill="none" class="axis" />

  <!-- Etichette Assi -->
  <text x="395" y="224" class="label">Re(z)</text>
  <text x="210" y="42" class="label" text-anchor="middle">Im(z)</text>

  <!-- Cerchio del Polo (|z| = |p| = 65 px) -->
  <circle cx="210" cy="220" r="65" class="pole-circle" />

  <!-- Cerchio Unitario (|z| = 1, r = 130 px) -->
  <circle cx="210" cy="220" r="130" class="unit-circle" />

  <!-- Polo (x a z = 0.5, cioe x = 210 + 65 = 275) -->
  <line x1="270" y1="215" x2="280" y2="225" class="pole-mark" />
  <line x1="280" y1="215" x2="270" y2="225" class="pole-mark" />
  <text x="282" y="212" class="label-red">p</text>

  <!-- Etichette Cerchi -->
  <text x="345" y="214" class="label-blue">|z| = 1</text>
  <text x="205" y="150" class="label" text-anchor="end" font-style="italic">|z| = |p|</text>

  <!-- Testi descrittivi -->
  <text x="210" y="20" class="title">Sequenza Causale: x(n) = pⁿ u(n)</text>
  <text x="210" y="365" class="subtitle">ROC: |z| &gt; |p|</text>
  <text x="210" y="385" class="label" text-anchor="middle" font-weight="bold">Include |z| = 1 ➔ Stabile e Causale</text>
</svg>