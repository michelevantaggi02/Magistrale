<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 475" width="100%" height="100%">
  <defs>
    <style>
      .bg-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .axis-line { stroke: #64748b; stroke-width: 1.5; }
      .grid-dash { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4,4; }
      .unit-circle { stroke: #0f172a; stroke-width: 1.8; fill: #ffffff; fill-opacity: 0.9; }
      .ray-line { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3,3; }
      
      .vec-pole { stroke: #dc2626; stroke-width: 2.4; fill: none; }
      .vec-zero { stroke: #0284c7; stroke-width: 2.4; fill: none; }
      
      .spectrum-curve { stroke: #4f46e5; stroke-width: 2.8; fill: none; }
      
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-axis-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      
      .label-pole { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #dc2626; }
      .label-zero { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0284c7; }
      .label-point { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #059669; }
      
      .badge-vec-pole { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .badge-vec-zero { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      
      .note-box { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .note-bold { font-weight: bold; }
    </style>
    
    <marker id="arrow-zero" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-pole" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ==================== PANNELLO SINISTRO: PIANO Z ==================== -->
  <rect x="15" y="15" width="435" height="365" class="bg-card" />
  <text x="232" y="38" class="text-title">Piano Z (Poli, Zeri e Cerchio Unitario)</text>
  <text x="232" y="54" class="text-subtitle">Il punto mobile <tspan font-style="italic">z</tspan> = <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8.5px">j&#969;</tspan> percorre la circonferenza |<tspan font-style="italic">z</tspan>| = 1</text>

  <!-- Assi coordinati Re e Im -->
  <line x1="30" y1="230" x2="425" y2="230" class="axis" />
  <line x1="195" y1="365" x2="195" y2="70" class="axis" />
  <polyline points="419,226 425,230 419,234" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <polyline points="191,76 195,70 199,76" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <text x="408" y="248" class="text-axis">Re(z)</text>
  <text x="205" y="82" class="text-axis">Im(z)</text>
  <text x="181" y="245" class="text-axis">0</text>

  <!-- Cerchio unitario -->
  <circle cx="195" cy="230" r="120" class="unit-circle" />
  <line x1="315" y1="226" x2="315" y2="234" stroke="#0f172a" stroke-width="1.6" />
  <text x="311" y="246" class="text-axis-bold">1</text>
  <text x="40" y="352" class="text-axis" style="font-weight: 500;">Cerchio unitario |z| = 1</text>

  <!-- Raggi di riferimento angolare -->
  <line x1="195" y1="230" x2="241.4" y2="87.3" class="ray-line" />
  <line x1="195" y1="230" x2="360.5" y2="176.2" class="ray-line" />
  <line x1="195" y1="230" x2="279.9" y2="145.1" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Archi angolari -->
  <!-- phi1 -->
  <path d="M 237 230 A 42 42 0 0 0 234.9 217.0" fill="none" stroke="#0284c7" stroke-width="1.3" />
  <text x="243" y="224" class="label-zero" style="font-size: 11px;">&#981;&#8321;</text>

  <!-- omega -->
  <path d="M 260 230 A 65 65 0 0 0 241.0 184.0" fill="none" stroke="#059669" stroke-width="1.5" />
  <text x="257.8" y="194.8" class="label-point" style="font-size: 11px;">&#969;</text>

  <!-- omega1 -->
  <path d="M 283 230 A 88 88 0 0 0 222.2 146.3" fill="none" stroke="#dc2626" stroke-width="1.3" />
  <text x="242.3" y="151.1" class="label-pole" style="font-size: 11px;">&#969;&#8321;</text>

  <!-- Vettore distanza dal polo: da p1 a e^jw -->
  <line x1="221.7" y1="147.8" x2="277.9" y2="146.1" class="vec-pole" marker-end="url(#arrow-pole)" />
  <rect x="220.8" y="126.5" width="60" height="17" fill="#ffffff" stroke="#fecaca" stroke-width="1" rx="3" />
  <text x="250.8" y="139.5" class="badge-vec-pole">|<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">p</tspan>&#8321;|</text>

  <!-- Vettore distanza dallo zero: da z1 a e^jw -->
  <line x1="341.1" y1="182.5" x2="282.9" y2="144.1" class="vec-zero" marker-end="url(#arrow-zero)" />
  <rect x="280.5" y="171.8" width="60" height="17" fill="#ffffff" stroke="#bae6fd" stroke-width="1" rx="3" />
  <text x="310.5" y="184.8" class="badge-vec-zero">|<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">z</tspan>&#8321;|</text>

  <!-- Polo p1 (X rossa) -->
  <g transform="translate(221.7, 147.8)">
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" />
    <line x1="-6" y1="6" x2="6" y2="-6" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" />
  </g>
  <rect x="173.7" y="121.8" width="42" height="18" fill="#ffffff" stroke="#fca5a5" stroke-width="1" rx="3" opacity="0.95" />
  <text x="194.7" y="134.8" class="label-pole" text-anchor="middle"><tspan font-style="italic">p</tspan>&#8321;</text>

  <!-- Zero z1 (Cerchio blu) -->
  <circle cx="341.1" cy="182.5" r="5.5" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
  <rect x="351.1" y="173.5" width="42" height="18" fill="#ffffff" stroke="#7dd3fc" stroke-width="1" rx="3" opacity="0.95" />
  <text x="372.1" y="186.5" class="label-zero" text-anchor="middle"><tspan font-style="italic">z</tspan>&#8321;</text>

  <!-- Punto mobile z = e^jw -->
  <circle cx="279.9" cy="145.1" r="5.5" fill="#10b981" stroke="#065f46" stroke-width="1.8" />
  <rect x="289.9" y="121.1" width="78" height="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" rx="3" opacity="0.95" />
  <text x="328.9" y="135.1" class="label-point" text-anchor="middle"><tspan font-style="italic">z</tspan> = <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="9px">j&#969;</tspan></text>

  <!-- Legenda coordinate polo e zero in alto a sinistra -->
  <rect x="25" y="68" width="138" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4" opacity="0.95" />
  <text x="32" y="85" class="label-pole" style="font-size: 11px;"><tspan font-style="italic">p</tspan>&#8321; = |<tspan font-style="italic">p</tspan>&#8321;| <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#969;&#8321;</tspan></text>
  <text x="32" y="102" class="label-zero" style="font-size: 11px;"><tspan font-style="italic">z</tspan>&#8321; = |<tspan font-style="italic">z</tspan>&#8321;| <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#981;&#8321;</tspan></text>


  <!-- ==================== PANNELLO DESTRO: RISPOSTA IN FREQUENZA ==================== -->
  <rect x="465" y="15" width="440" height="365" class="bg-card" />
  <text x="685" y="38" class="text-title">Risposta in Frequenza |H(&#969;)|</text>
  <text x="685" y="54" class="text-subtitle">|H(&#969;)| = |<tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#969;</tspan> &#8722; <tspan font-style="italic">z</tspan>&#8321;| / |<tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#969;</tspan> &#8722; <tspan font-style="italic">p</tspan>&#8321;| = (distanza dallo zero) / (distanza dal polo)</text>

  <!-- Assi della risposta in frequenza -->
  <line x1="495" y1="345" x2="887" y2="345" class="axis-line" />
  <line x1="495" y1="345" x2="495" y2="75" class="axis-line" />
  <polyline points="881,341 887,345 881,349" fill="none" stroke="#64748b" stroke-width="1.5" />
  <polyline points="491,80 495,74 499,80" fill="none" stroke="#64748b" stroke-width="1.5" />
  <text x="879" y="363" class="text-axis-bold">&#969;</text>
  <text x="487" y="70" class="text-axis-bold" text-anchor="end">|H(&#969;)|</text>

  <!-- Tacche e label asse orizzontale omega -->
  <text x="495" y="363" class="text-axis" text-anchor="middle">0</text>
  
  <!-- Tacca phi1 -->
  <line x1="532.0" y1="345" x2="532.0" y2="349" stroke="#64748b" stroke-width="1.2" />
  <text x="532.0" y="363" class="label-zero" text-anchor="middle" style="font-size: 12px;">&#981;&#8321;</text>
  
  <!-- Tacca omega (corrente) -->
  <line x1="587.5" y1="345" x2="587.5" y2="349" stroke="#059669" stroke-width="1.5" />
  <text x="587.5" y="363" class="label-point" text-anchor="middle" style="font-size: 12px;">&#969;</text>

  <!-- Tacca omega1 -->
  <line x1="643.0" y1="345" x2="643.0" y2="349" stroke="#64748b" stroke-width="1.2" />
  <text x="643.0" y="363" class="label-pole" text-anchor="middle" style="font-size: 12px;">&#969;&#8321;</text>
  
  <!-- Tacca pi -->
  <line x1="865" y1="345" x2="865" y2="349" stroke="#64748b" stroke-width="1.2" />
  <text x="865" y="363" class="text-axis-bold" text-anchor="middle">&#960;</text>

  <!-- Linee guida verticali per Minimo e Massimo -->
  <!-- Valle a phi1 -->
  <line x1="532.0" y1="345" x2="532.0" y2="326.3" class="grid-dash" stroke="#0284c7" />
  <circle cx="532.0" cy="326.3" r="4.5" fill="#0284c7" />
  
  <!-- Annotazione Valle -->
  <path d="M 532.0 301.3 L 532.0 318.3" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-zero)" />
  <rect x="476.0" y="270.3" width="112" height="28" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="4" />
  <text x="532.0" y="283.3" class="label-zero" text-anchor="middle" style="font-size: 10px;">VALLE (Zero Dip)</text>
  <text x="532.0" y="294.3" class="text-subtitle" style="font-size: 9px; fill: #0369a1;">distanza |<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">z</tspan>&#8321;| min</text>

  <!-- Picco a omega1 -->
  <line x1="643.0" y1="345" x2="643.0" y2="127.7" class="grid-dash" stroke="#dc2626" />
  <circle cx="643.0" cy="127.7" r="4.5" fill="#dc2626" />
  
  <!-- Annotazione Picco -->
  <path d="M 643.0 99.7 L 643.0 119.7" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-pole)" />
  <rect x="585.0" y="69.7" width="116" height="28" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="4" />
  <text x="643.0" y="82.7" class="label-pole" text-anchor="middle" style="font-size: 10px;">PICCO (Pole Peak)</text>
  <text x="643.0" y="93.7" class="text-subtitle" style="font-size: 9px; fill: #b91c1c;">distanza |<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">p</tspan>&#8321;| min</text>

  <!-- Curva di risposta in frequenza |H(omega)| -->
  <path d="M 495.0 321.1 L 496.2 321.5 L 497.5 321.8 L 498.7 322.1 L 499.9 322.4 L 501.2 322.7 L 502.4 323.1 L 503.7 323.4 L 504.9 323.7 L 506.1 323.9 L 507.4 324.2 L 508.6 324.5 L 509.8 324.8 L 511.1 325.0 L 512.3 325.3 L 513.6 325.5 L 514.8 325.7 L 516.0 325.9 L 517.3 326.1 L 518.5 326.2 L 519.7 326.4 L 521.0 326.5 L 522.2 326.6 L 523.5 326.7 L 524.7 326.7 L 525.9 326.7 L 527.2 326.7 L 528.4 326.6 L 529.6 326.6 L 530.9 326.4 L 532.1 326.3 L 533.4 326.1 L 534.6 325.9 L 535.8 325.6 L 537.1 325.3 L 538.3 324.9 L 539.5 324.5 L 540.8 324.1 L 542.0 323.6 L 543.3 323.1 L 544.5 322.6 L 545.7 322.0 L 547.0 321.3 L 548.2 320.7 L 549.4 320.0 L 550.7 319.2 L 551.9 318.4 L 553.2 317.6 L 554.4 316.7 L 555.6 315.8 L 556.9 314.9 L 558.1 313.9 L 559.3 312.8 L 560.6 311.8 L 561.8 310.7 L 563.1 309.5 L 564.3 308.3 L 565.5 307.1 L 566.8 305.8 L 568.0 304.5 L 569.2 303.2 L 570.5 301.7 L 571.7 300.3 L 573.0 298.8 L 574.2 297.3 L 575.4 295.7 L 576.7 294.1 L 577.9 292.4 L 579.1 290.6 L 580.4 288.8 L 581.6 287.0 L 582.9 285.1 L 584.1 283.2 L 585.3 281.2 L 586.6 279.1 L 587.8 277.0 L 589.0 274.8 L 590.3 272.5 L 591.5 270.2 L 592.8 267.9 L 594.0 265.4 L 595.2 262.9 L 596.5 260.3 L 597.7 257.7 L 598.9 255.0 L 600.2 252.2 L 601.4 249.3 L 602.7 246.4 L 603.9 243.4 L 605.1 240.3 L 606.4 237.1 L 607.6 233.9 L 608.8 230.6 L 610.1 227.3 L 611.3 223.8 L 612.6 220.3 L 613.8 216.8 L 615.0 213.2 L 616.3 209.5 L 617.5 205.8 L 618.7 202.0 L 620.0 198.2 L 621.2 194.4 L 622.5 190.6 L 623.7 186.7 L 624.9 182.9 L 626.2 179.1 L 627.4 175.3 L 628.6 171.6 L 629.9 167.9 L 631.1 164.4 L 632.4 160.9 L 633.6 157.5 L 634.8 154.2 L 636.1 151.1 L 637.3 148.1 L 638.5 145.3 L 639.8 142.7 L 641.0 140.2 L 642.3 138.0 L 643.5 136.0 L 644.7 134.2 L 646.0 132.6 L 647.2 131.2 L 648.4 130.1 L 649.7 129.2 L 650.9 128.5 L 652.2 128.0 L 653.4 127.8 L 654.6 127.7 L 655.9 127.8 L 657.1 128.1 L 658.3 128.5 L 659.6 129.2 L 660.8 129.9 L 662.1 130.8 L 663.3 131.8 L 664.5 133.0 L 665.8 134.2 L 667.0 135.5 L 668.2 136.9 L 669.5 138.3 L