 L 847.7 253.3 L 848.9 253.6 L 850.2 253.8 L 851.4 254.1 L 852.6 254.4 L 853.9 254.6 L 855.1 254.9 L 856.3 255.2 L 857.6 255.4 L 858.8 255.7 L 860.1 256.0 L 861.3 256.2 L 862.5 256.5 L 863.8 256.7 L 865.0 257.0" class="spectrum-curve" />

  <!-- Punto mobile corrente sulla curva -->
  <line x1="587.5" y1="345" x2="587.5" y2="277.5" stroke="#059669" stroke-width="1.2" stroke-dasharray="3,3" />
  <circle cx="587.5" cy="277.5" r="5" fill="#10b981" stroke="#065f46" stroke-width="1.5" />
  <text x="597.5" y="281.5" class="label-point" style="font-size: 11px;">|H(&#969;)|</text>


  <!-- ==================== BANNER RIASSUNTIVO INFERIORE ==================== -->
  <rect x="15" y="395" width="890" height="66" class="note-box" />
  
  <circle cx="40" cy="417" r="4.5" fill="#dc2626" />
  <text x="54" y="421" class="note-text"><tspan class="note-bold" fill="#dc2626">Avvicinamento al Polo <tspan font-style="italic">p</tspan>&#8321; (&#969; &#8594; &#969;&#8321;):</tspan> la distanza a denominatore |<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">p</tspan>&#8321;| = |<tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#969;</tspan> &#8722; <tspan font-style="italic">p</tspan>&#8321;| diventa minima &#8594; l'ampiezza |H(&#969;)| cresce generando un <tspan class="note-bold">picco di risonanza (pole peak)</tspan>.</text>
  
  <circle cx="40" cy="443" r="4.5" fill="#0284c7" />
  <text x="54" y="447" class="note-text"><tspan class="note-bold" fill="#0284c7">Avvicinamento allo Zero <tspan font-style="italic">z</tspan>&#8321; (&#969; &#8594; &#981;&#8321;):</tspan> la distanza a numeratore |<tspan font-style="italic">z</tspan> &#8722; <tspan font-style="italic">z</tspan>&#8321;| = |<tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="8px">j&#969;</tspan> &#8722; <tspan font-style="italic">z</tspan>&#8321;| diventa minima &#8594; l'ampiezza |H(&#969;)| scende generando una <tspan class="note-bold">valle di attenuazione (zero dip)</tspan>.</text>
</svg>