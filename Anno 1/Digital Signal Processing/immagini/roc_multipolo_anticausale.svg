<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <style>
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .unit-circle { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
      .pole-circle { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .roc { fill: #ef4444; fill-opacity: 0.25; }
      .pole-mark { stroke: #dc2626; stroke-width: 2.5; stroke-linecap: round; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #b91c1c; text-anchor: middle; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .label-blue { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1d4ed8; }
      .label-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #b91c1c; }
    </style>
  </defs>

  <!-- ROC: Interno a r1=60 -->
  <circle cx="210" cy="220" r="60" class="roc" />

  <!-- Assi -->
  <line x1="30" y1="220" x2="390" y2="220" class="axis" />
  <polyline points="383,216 390,220 383,224" fill="none" class="axis" />
  <line x1="210" y1="390" x2="210" y2="50" class="axis" />
  <polyline points="206,57 210,50 214,57" fill="none" class="axis" />
  <text x="395" y="224" class="label">Re</text>
  <text x="210" y="42" class="label" text-anchor="middle">Im</text>

  <!-- Cerchi poli e cerchio unitario -->
  <circle cx="210" cy="220" r="60" class="pole-circle" stroke="#dc2626" />
  <circle cx="210" cy="220" r="100" class="unit-circle" />
  <circle cx="210" cy="220" r="135" class="pole-circle" />

  <!-- Poli -->
  <!-- p1 -->
  <line x1="265" y1="215" x2="275" y2="225" class="pole-mark" />
  <line x1="275" y1="215" x2="265" y2="225" class="pole-mark" />
  <text x="270" y="212" class="label-red">p₁</text>

  <!-- p2 -->
  <line x1="340" y1="215" x2="350" y2="225" class="pole-mark" />
  <line x1="350" y1="215" x2="340" y2="225" class="pole-mark" />
  <text x="345" y="212" class="label-red">p₂</text>

  <text x="312" y="214" class="label-blue">|z|=1</text>

  <text x="210" y="22" class="title">3. ROC Interna (Anticausale)</text>
  <text x="210" y="365" class="subtitle">ROC: |z| &lt; |p₁|</text>
  <text x="210" y="385" class="label" text-anchor="middle" font-weight="bold">Esclude |z|=1 ➔ Anticausale e Instabile</text>
</svg>