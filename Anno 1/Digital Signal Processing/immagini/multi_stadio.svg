<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #64748b; }
      
      .sec-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      
      .box-up { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; rx: 6px; }
      .box-filt { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.6; rx: 6px; }
      .box-down { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.6; rx: 6px; }
      
      .stage-card { fill: #ffffff; stroke: #0284c7; stroke-width: 1.3; stroke-dasharray: 4,3; rx: 8px; fill-opacity: 0.6; }
      
      .wire { stroke: #334155; stroke-width: 1.8; fill: none; }
      
      .label-up { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .label-filt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0891b2; text-anchor: middle; }
      .label-filt-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #0e7490; text-anchor: middle; }
      .label-down { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #9333ea; text-anchor: middle; }
      
      .label-sig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      
      .tag-stage { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      
      .badge-info { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 8px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .badge-bold { font-weight: 700; fill: #0f172a; }
      
      .anno-box { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.2; rx: 6px; }
      .anno-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #92400e; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1.5 L 6 4 L 0 6.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="940" height="480" class="bg" />

  <!-- Header -->
  <text x="28" y="38" class="title">Filtri Multi-Stadio: Conversione di Frequenza di Campionamento</text>
  <text x="28" y="58" class="subtitle">Scomposizione dell'interpolatore L = 160 in fattori decrescenti (8 · 5 · 4 = 160) con decimatore M = 147</text>

  <!-- Top Right Parameter Card -->
  <g transform="translate(590, 18)">
    <rect x="0" y="0" width="340" height="65" class="badge-info" />
    <text x="15" y="20" class="badge-text"><tspan class="badge-bold">Esempio Audio:</tspan> L = 160, M = 147 (da 44.1 kHz a 48 kHz)</text>
    <text x="15" y="38" class="badge-text"><tspan class="badge-bold" fill="#0284c7">L &gt; M (160 &gt; 147)</tspan> → Banda minima = π / 160 (interpolatore)</text>
    <text x="15" y="54" class="badge-text">Si scompone l'interpolatore in: <tspan font-weight="bold" fill="#16a34a">8 · 5 · 4 = 160</tspan></text>
  </g>

  <!-- ==================== SEZIONE 1: STADIO SINGOLO ==================== -->
  <text x="30" y="110" class="sec-title">1. Architettura a singolo stadio (Monolitica - computazionalmente inefficiente)</text>

  <!-- Input x(n) -->
  <line x1="40" y1="160" x2="130" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="85" y="150" class="label-sig">x(n)</text>

  <!-- Block Up 160 -->
  <rect x="130" y="132" width="120" height="56" class="box-up" />
  <text x="190" y="157" class="label-up">↑ 160</text>
  <text x="190" y="174" font-family="sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Upsampler</text>

  <!-- Wire 1 -> Filter -->
  <line x1="250" y1="160" x2="340" y2="160" class="wire" marker-end="url(#arrow)" />

  <!-- Block Filter pi/160 -->
  <rect x="340" y="128" width="180" height="64" class="box-filt" stroke="#dc2626" fill="#fef2f2" />
  <text x="430" y="153" class="label-filt" fill="#dc2626">π / 160</text>
  <text x="430" y="169" class="label-filt-sub" fill="#b91c1c">Filtro Interpolatore</text>
  <text x="430" y="182" font-family="sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">Ordine N enorme, opera a 160 fs!</text>

  <!-- Wire Filter -> Down -->
  <line x1="520" y1="160" x2="610" y2="160" class="wire" marker-end="url(#arrow)" />

  <!-- Block Down 147 -->
  <rect x="610" y="132" width="120" height="56" class="box-down" />
  <text x="670" y="157" class="label-down">↓ 147</text>
  <text x="670" y="174" font-family="sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle">Downsampler</text>

  <!-- Output y(m) -->
  <line x1="730" y1="160" x2="820" y2="160" class="wire" marker-end="url(#arrow)" />
  <text x="775" y="150" class="label-sig">y(m)</text>

  <!-- Dimension / factorization bracket under single stage -->
  <g transform="translate(130, 195)">
    <line x1="0" y1="8" x2="390" y2="8" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" />
    <path d="M 0 0 L 0 8 M 390 0 L 390 8 M 195 8 L 195 18" stroke="#64748b" stroke-width="1.2" />
    <text x="195" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">Scomposizione in 3 stadi più piccoli: 8 × 5 × 4 = 160</text>
  </g>

  <!-- Transition Arrow -->
  <path d="M 480 235 L 480 270" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />


  <!-- ==================== SEZIONE 2: MULTI-STADIO ==================== -->
  <text x="30" y="285" class="sec-title">2. Architettura multi-stadio equivalente (Fattori decrescenti: 8 → 5 → 4)</text>

  <!-- Input x(n) -->
  <line x1="25" y1="355" x2="75" y2="355" class="wire" marker-end="url(#arrow)" />
  <text x="50" y="345" class="label-sig">x(n)</text>

  <!-- STAGE 1: x8 (Box container) -->
  <g transform="translate(75, 305)">
    <rect x="0" y="0" width="200" height="100" class="stage-card" />
    <text x="100" y="18" class="tag-stage">Stadio 1 (Fattore 8)</text>
    
    <!-- Up 8 -->
    <rect x="15" y="28" width="65" height="52" class="box-up" />
    <text x="47" y="58" class="label-up">↑ 8</text>
    
    <!-- Wire -->
    <line x1="80" y1="54" x2="115" y2="54" class="wire" marker-end="url(#arrow)" />
    
    <!-- Filter pi/8 -->
    <rect x="115" y="28" width="70" height="52" class="box-filt" />
    <text x="150" y="52" class="label-filt">π / 8</text>
    <text x="150" y="68" class="label-filt-sub">Filtro 1</text>
  </g>

  <!-- Wire Stage 1 -> Stage 2 -->
  <line x1="275" y1="355" x2="315" y2="355" class="wire" marker-end="url(#arrow)" />

  <!-- STAGE 2: x5 (Box container) -->
  <g transform="translate(315, 305)">
    <rect x="0" y="0" width="200" height="100" class="stage-card" />
    <text x="100" y="18" class="tag-stage">Stadio 2 (Fattore 5)</text>
    
    <!-- Up 5 -->
    <rect x="15" y="28" width="65" height="52" class="box-up" />
    <text x="47" y="58" class="label-up">↑ 5</text>
    
    <!-- Wire -->
    <line x1="80" y1="54" x2="115" y2="54" class="wire" marker-end="url(#arrow)" />
    
    <!-- Filter pi/5 -->
    <rect x="115" y="28" width="70" height="52" class="box-filt" />
    <text x="150" y="52" class="label-filt">π / 5</text>
    <text x="150" y="68" class="label-filt-sub">Filtro 2</text>
  </g>

  <!-- Wire Stage 2 -> Stage 3 -->
  <line x1="515" y1="355" x2="555" y2="355" class="wire" marker-end="url(#arrow)" />

  <!-- STAGE 3: x4 (Box container) -->
  <g transform="translate(555, 305)">
    <rect x="0" y="0" width="200" height="100" class="stage-card" />
    <text x="100" y="18" class="tag-stage">Stadio 3 (Fattore 4)</text>
    
    <!-- Up 4 -->
    <rect x="15" y="28" width="65" height="52" class="box-up" />
    <text x="47" y="58" class="label-up">↑ 4</text>
    
    <!-- Wire -->
    <line x1="80" y1="54" x2="115" y2="54" class="wire" marker-end="url(#arrow)" />
    
    <!-- Filter pi/4 -->
    <rect x="115" y="28" width="70" height="52" class="box-filt" />
    <text x="150" y="52" class="label-filt">π / 4</text>
    <text x="150" y="68" class="label-filt-sub">Filtro 3</text>
  </g>

  <!-- Wire Stage 3 -> Decimator -->
  <line x1="755" y1="355" x2="795" y2="355" class="wire" marker-end="url(#arrow)" />

  <!-- Downsampler 147 (Single stage retained) -->
  <rect x="795" y="329" width="85" height="52" class="box-down" />
  <text x="837" y="354" class="label-down">↓ 147</text>
  <text x="837" y="370" font-family="sans-serif" font-size="9.5" fill="#7e22ce" text-anchor="middle">Decimatore</text>

  <!-- Output y(m) -->
  <line x1="880" y1="355" x2="935" y2="355" class="wire" marker-end="url(#arrow)" />
  <text x="910" y="345" class="label-sig">y(m)</text>


  <!-- Bottom Explanatory Banner -->
  <g transform="translate(30, 425)">
    <rect x="0" y="0" width="900" height="52" class="anno-box" />
    <text x="15" y="22" class="anno-text" font-weight="bold">Vantaggio architetturale:</text>
    <text x="155" y="22" class="anno-text">La regola impone l'ordine dal fattore più grande al più piccolo (8 → 5 → 4): in questo modo il filtro più selettivo opera alla frequenza più bassa.</text>
    <text x="15" y="40" class="anno-text">Ciascun filtro ha transizione più blanda e ordine N drasticamente ridotto; il decimatore per 147 non viene decomposto poiché il vincolo critico era sull'interpolatore.</text>
  </g>

</svg>