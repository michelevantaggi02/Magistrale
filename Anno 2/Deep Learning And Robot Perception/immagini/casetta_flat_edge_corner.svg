<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%">
  <defs>
    <style>
      .title-main { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .label-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; }
      .pill-flat { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #d97706; }
      .pill-edge { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #0284c7; }
      .pill-corner { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #dc2626; }
      .note-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <rect width="980" height="480" fill="#f8fafc" rx="12" />

  <!-- Immagine di Contesto: Casetta con le 3 aree evidenziate -->
  <g transform="translate(40, 40)">
    <rect width="320" height="380" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10" />
    <text x="160" y="32" text-anchor="middle" class="title-main">Scena di Riferimento</text>

    <!-- Disegno Casetta -->
    <g transform="translate(80, 110)">
      <!-- Cielo / Sfondo attorno -->
      <!-- Pareti -->
      <rect x="0" y="70" width="160" height="130" fill="#f1f5f9" stroke="#334155" stroke-width="2.5" />
      <!-- Porta -->
      <rect x="60" y="120" width="40" height="80" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <!-- Finestra -->
      <rect x="15" y="90" width="35" height="35" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
      <!-- Tetto -->
      <polygon points="80,0 -20,70 180,70" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5" />

      <!-- Quadratino 1: Flat (Parete) -->
      <rect x="110" y="90" width="30" height="30" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,2" />
      <circle cx="125" cy="105" r="3" fill="#d97706" />

      <!-- Quadratino 2: Edge (Falda Tetto) -->
      <rect x="20" y="25" width="30" height="30" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,2" />
      <circle cx="35" cy="40" r="3" fill="#0284c7" />

      <!-- Quadratino 3: Corner (Vertice Tetto) -->
      <rect x="65" y="-15" width="30" height="30" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,2" />
      <circle cx="80" cy="0" r="4" fill="#dc2626" />
    </g>

    <text x="160" y="350" text-anchor="middle" class="note-text">Analisi locale su finestre di test (patch W)</text>
  </g>

  <!-- Linee connettive verso gli ingrandimenti a destra -->
  <!-- Flat: da (80+125=205, 110+105=215 + 40 = 255) a (400, 90) -->
  <path d="M 245 255 C 310 240, 340 90, 400 90" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" />
  <!-- Edge: da (80+35=115, 110+40=150 + 40 = 190) a (400, 220) -->
  <path d="M 155 190 C 260 170, 320 220, 400 220" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3" />
  <!-- Corner: da (80+80=160, 110+0=110 + 40 = 150) a (400, 350) -->
  <path d="M 200 150 C 270 140, 330 350, 400 350" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Dettaglio 1: Flat Region -->
  <g transform="translate(410, 40)">
    <rect width="530" height="110" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" rx="8" />
    <!-- Ingrandimento Grafico -->
    <g transform="translate(15, 15)">
      <rect width="80" height="80" fill="#f8fafc" stroke="#d97706" stroke-width="2" rx="4" />
      <rect x="25" y="25" width="30" height="30" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2" />
      <!-- Frecce di shift in tutte le direzioni con crocetta -->
      <line x1="40" y1="20" x2="40" y2="10" stroke="#d97706" stroke-width="1.5" />
      <line x1="40" y1="60" x2="40" y2="70" stroke="#d97706" stroke-width="1.5" />
      <line x1="20" y1="40" x2="10" y2="40" stroke="#d97706" stroke-width="1.5" />
      <line x1="60" y1="40" x2="70" y2="40" stroke="#d97706" stroke-width="1.5" />
    </g>
    <!-- Spiegazione -->
    <g transform="translate(110, 20)">
      <text x="0" y="10" class="pill-flat">REGIONE PIATTA (Flat Region)</text>
      <text x="0" y="32" class="label-desc">• Spostando la finestra in <tspan font-weight="bold">qualsiasi direzione</tspan>, l'intensità non cambia (E ≈ 0).</text>
      <text x="0" y="52" class="label-desc">• Impossibile localizzare: ogni pixel limitrofo ha lo stesso aspetto.</text>
      <text x="0" y="70" class="note-text">Gradiente nullo: ∇I ≈ 0 → Nessuna informazione utile.</text>
    </g>
  </g>

  <!-- Dettaglio 2: Edge Region -->
  <g transform="translate(410, 170)">
    <rect width="530" height="110" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="8" />
    <!-- Ingrandimento Grafico -->
    <g transform="translate(15, 15)">
      <rect width="80" height="80" fill="#f8fafc" stroke="#0284c7" stroke-width="2" rx="4" />
      <polygon points="0,80 80,0 80,80" fill="#fca5a5" />
      <line x1="0" y1="80" x2="80" y2="0" stroke="#dc2626" stroke-width="2.5" />
      <!-- Finestra -->
      <rect x="25" y="25" width="30" height="30" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>
    <!-- Spiegazione -->
    <g transform="translate(110, 20)">
      <text x="0" y="10" class="pill-edge">BORDO (Edge Region)</text>
      <text x="0" y="32" class="label-desc">• Forte variazione ortogonalmente al bordo; <tspan font-weight="bold">nessuna variazione lungo il bordo</tspan>.</text>
      <text x="0" y="52" class="label-desc">• <tspan font-weight="bold">Problema dell'apertura (Aperture Problem):</tspan> posizione ambigua in 1D.</text>
      <text x="0" y="70" class="note-text">Gradiente monodirezionale: rango matrice = 1.</text>
    </g>
  </g>

  <!-- Dettaglio 3: Corner Region -->
  <g transform="translate(410, 300)">
    <rect width="530" height="110" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" rx="8" />
    <!-- Ingrandimento Grafico -->
    <g transform="translate(15, 15)">
      <rect width="80" height="80" fill="#f8fafc" stroke="#dc2626" stroke-width="2" rx="4" />
      <polygon points="40,25 0,75 80,75" fill="#fca5a5" stroke="#dc2626" stroke-width="2" />
      <circle cx="40" cy="25" r="5" fill="#dc2626" />
      <!-- Finestra centrata su vertice -->
      <rect x="25" y="10" width="30" height="30" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>
    <!-- Spiegazione -->
    <g transform="translate(110, 20)">
      <text x="0" y="10" class="pill-corner">ANGOLO (Corner / Keypoint Ideale)</text>
      <text x="0" y="32" class="label-desc">• Lo spostamento in <tspan font-weight="bold">qualsiasi direzione</tspan> produce una forte variazione d'intensità.</text>
      <text x="0" y="52" class="label-desc">• <tspan font-weight="bold">Perfettamente localizzabile in 2D:</tspan> minimizza le ambiguità di matching.</text>
      <text x="0" y="70" class="note-text">Gradienti non collineari: rango matrice = 2 (λmin e λmax entrambi elevati).</text>
    </g>
  </g>
</svg>
