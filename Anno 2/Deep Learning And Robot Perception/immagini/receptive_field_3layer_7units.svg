<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
      .node-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      
      .node-inactive { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .node-rf1 { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.2; }
      .node-rf2 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.2; }
      .node-rf3 { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; }
      .node-center { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; }
      
      .edge-active { stroke: #2563eb; stroke-width: 2; marker-end: url(#arr-blue); fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 2; marker-end: url(#arr-green); fill: none; }
      .edge-purple { stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arr-purple); fill: none; }
      .edge-faint { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3,3; }
      
      .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .badge-rf { fill: #dbeafe; stroke: #93c5fd; rx: 4; }
    </style>
    <marker id="arr-blue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2563eb" />
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#16a34a" />
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="960" height="480" class="bg" />

  <!-- Intestazione -->
  <text x="35" y="34" class="title">Connettività Locale e Receptive Field Diretto a 3 Livelli</text>
  <text x="35" y="54" class="subtitle">Esempio con 3 strati da 7 unità: ogni neurone convoluzionale riceve connessioni unicamente da un intorno locale di dimensione k = 3</text>

  <!-- Pannello Sinistro: Grafo dei 3 Strati con 7 unità -->
  <g transform="translate(35, 75)">
    <!-- Rettangolo di sfondo per l'area di calcolo -->
    <rect width="580" height="375" class="card" />

    <!-- Etichette Strati a Sinistra -->
    <text x="25" y="80" class="layer-title">Layer 3 (Output / Livello 3)</text>
    <text x="25" y="195" class="layer-title">Layer 2 (Nascosto / Livello 2)</text>
    <text x="25" y="310" class="layer-title">Layer 1 (Input / Livello 1)</text>

    <!-- Guide Orizzontali -->
    <line x1="25" y1="110" x2="555" y2="110" class="edge-faint" />
    <line x1="25" y1="225" x2="555" y2="225" class="edge-faint" />
    <line x1="25" y1="340" x2="555" y2="340" class="edge-faint" />

    <!-- 1. Layer 1 (Input, y = 340): 7 unità da x = 60 a x = 520 (step 76 px circa) -->
    <!-- Coordinate x per i 7 neuroni: 60, 136, 212, 288, 364, 440, 516 -->
    
    <!-- Connessioni Layer 1 -> Layer 2 (neuroni 3, 4, 5 verso h_{2,4}) -->
    <path d="M 212 320 L 284 246" class="edge-active" />
    <path d="M 288 320 L 288 246" class="edge-active" />
    <path d="M 364 320 L 292 246" class="edge-active" />

    <!-- Connessioni Layer 2 -> Layer 3 (neurone centrale h_{2,4} verso i neuroni 3, 4, 5 del Layer 3) -->
    <path d="M 288 205 L 216 131" class="edge-purple" />
    <path d="M 288 205 L 288 131" class="edge-purple" />
    <path d="M 288 205 L 360 131" class="edge-purple" />

    <!-- Disegno Neuroni Layer 1 (Input) -->
    <!-- N1 -->
    <circle cx="60" cy="340" r="18" class="node-inactive" />
    <text x="60" y="340" class="node-txt" fill="#94a3b8">x₁</text>
    <!-- N2 -->
    <circle cx="136" cy="340" r="18" class="node-inactive" />
    <text x="136" y="340" class="node-txt" fill="#94a3b8">x₂</text>
    <!-- N3 (RF locale di h_{2,4}) -->
    <circle cx="212" cy="340" r="19" class="node-rf1" />
    <text x="212" y="340" class="node-txt" fill="#1d4ed8">x₃</text>
    <!-- N4 (RF locale centrale) -->
    <circle cx="288" cy="340" r="20" class="node-rf1" stroke-width="3" />
    <text x="288" y="340" class="node-txt" fill="#1d4ed8">x₄</text>
    <!-- N5 (RF locale di h_{2,4}) -->
    <circle cx="364" cy="340" r="19" class="node-rf1" />
    <text x="364" y="340" class="node-txt" fill="#1d4ed8">x₅</text>
    <!-- N6 -->
    <circle cx="440" cy="340" r="18" class="node-inactive" />
    <text x="440" y="340" class="node-txt" fill="#94a3b8">x₆</text>
    <!-- N7 -->
    <circle cx="516" cy="340" r="18" class="node-inactive" />
    <text x="516" y="340" class="node-txt" fill="#94a3b8">x₇</text>

    <!-- Evidenziazione Receptive Field Locale su Layer 1 -->
    <rect x="186" y="366" width="204" height="24" class="badge-rf" />
    <text x="288" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Receptive Field Locale di h₂,₄ (k = 3)</text>

    <!-- Disegno Neuroni Layer 2 (Nascosto) -->
    <!-- N1 -->
    <circle cx="60" cy="225" r="18" class="node-inactive" />
    <text x="60" y="225" class="node-txt" fill="#94a3b8">h₂,₁</text>
    <!-- N2 -->
    <circle cx="136" cy="225" r="18" class="node-inactive" />
    <text x="136" y="225" class="node-txt" fill="#94a3b8">h₂,₂</text>
    <!-- N3 -->
    <circle cx="212" cy="225" r="18" class="node-inactive" />
    <text x="212" y="225" class="node-txt" fill="#94a3b8">h₂,₃</text>
    <!-- N4 (Neurone Centrale Attivo) -->
    <circle cx="288" cy="225" r="20" class="node-center" />
    <text x="288" y="225" class="node-txt" fill="#6d28d9">h₂,₄</text>
    <!-- N5 -->
    <circle cx="364" cy="225" r="18" class="node-inactive" />
    <text x="364" y="225" class="node-txt" fill="#94a3b8">h₂,₅</text>
    <!-- N6 -->
    <circle cx="440" cy="225" r="18" class="node-inactive" />
    <text x="440" y="225" class="node-txt" fill="#94a3b8">h₂,₆</text>
    <!-- N7 -->
    <circle cx="516" cy="225" r="18" class="node-inactive" />
    <text x="516" y="225" class="node-txt" fill="#94a3b8">h₂,₇</text>

    <!-- Disegno Neuroni Layer 3 (Output) -->
    <!-- N1 -->
    <circle cx="60" cy="110" r="18" class="node-inactive" />
    <text x="60" y="110" class="node-txt" fill="#94a3b8">h₃,₁</text>
    <!-- N2 -->
    <circle cx="136" cy="110" r="18" class="node-inactive" />
    <text x="136" y="110" class="node-txt" fill="#94a3b8">h₃,₂</text>
    <!-- N3 (Riceve da h_{2,4}) -->
    <circle cx="212" cy="110" r="19" class="node-rf2" />
    <text x="212" y="110" class="node-txt" fill="#15803d">h₃,₃</text>
    <!-- N4 (Centrale, Riceve da h_{2,4}) -->
    <circle cx="288" cy="110" r="20" class="node-rf2" stroke-width="2.8" />
    <text x="288" y="110" class="node-txt" fill="#15803d">h₃,₄</text>
    <!-- N5 (Riceve da h_{2,4}) -->
    <circle cx="364" cy="110" r="19" class="node-rf2" />
    <text x="364" y="110" class="node-txt" fill="#15803d">h₃,₅</text>
    <!-- N6 -->
    <circle cx="440" cy="110" r="18" class="node-inactive" />
    <text x="440" y="110" class="node-txt" fill="#94a3b8">h₃,₆</text>
    <!-- N7 -->
    <circle cx="516" cy="110" r="18" class="node-inactive" />
    <text x="516" y="110" class="node-txt" fill="#94a3b8">h₃,₇</text>

    <!-- Etichette Pesi Kernel k=3 -->
    <rect x="225" y="270" width="38" height="18" fill="#ffffff" stroke="#93c5fd" rx="3" />
    <text x="244" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">w₁</text>
    <rect x="280" y="270" width="18" height="18" fill="#ffffff" stroke="#93c5fd" rx="3" />
    <text x="289" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">w₂</text>
    <rect x="315" y="270" width="38" height="18" fill="#ffffff" stroke="#93c5fd" rx="3" />
    <text x="334" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">w₃</text>
  </g>

  <!-- Pannello Destro: Scheda Analitica e Proprietà Fondamentali -->
  <g transform="translate(635, 75)">
    <rect width="290" height="375" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    
    <text x="20" y="28" class="box-title">Principi di Connettività</text>
    <text x="20" y="46" class="text" fill="#64748b">Sparse Connectivity vs Dense Layer</text>

    <!-- Sezione 1: Interazioni Sparse -->
    <g transform="translate(15, 65)">
      <rect width="260" height="75" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#1e40af">1. Connettività Sparsa (k = 3)</text>
      <text x="12" y="38" font-size="11" fill="#334155">In un layer denso, ogni unità riceverebbe</text>
      <text x="12" y="52" font-size="11" fill="#334155">tutte le 7 connessioni da Layer 1 (7 pesi).</text>
      <text x="12" y="66" font-size="11" font-weight="600" fill="#2563eb">Nel layer Conv: esattamente k = 3 connessioni.</text>
    </g>

    <!-- Sezione 2: Receptive Field Locale -->
    <g transform="translate(15, 155)">
      <rect width="260" height="95" fill="#f5f3ff" stroke="#ddd6fe" rx="6" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#6d28d9">2. Receptive Field Locale</text>
      <text x="12" y="38" font-size="11" fill="#334155">Il neurone h₂,₄ vede unicamente:</text>
      <text x="12" y="54" class="math" font-size="12" font-weight="bold" fill="#5b21b6">RF(h₂,₄) = { x₃, x₄, x₅ }</text>
      <text x="12" y="72" font-size="11" fill="#334155">I pixel x₁, x₂, x₆, x₇ non influenzano</text>
      <text x="12" y="86" font-size="11" fill="#334155">direttamente l'attivazione locale di h₂,₄.</text>
    </g>

    <!-- Sezione 3: Ventaglio verso lo Strato Successivo -->
    <g transform="translate(15, 265)">
      <rect width="260" height="95" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
      <text x="12" y="20" font-size="12" font-weight="700" fill="#166534">3. Diffusione Feed-Forward</text>
      <text x="12" y="38" font-size="11" fill="#334155">L'informazione elaborata da h₂,₄</text>
      <text x="12" y="52" font-size="11" fill="#334155">si propaga alle 3 unità adiacenti di Layer 3:</text>
      <text x="12" y="70" class="math" font-size="12" font-weight="bold" fill="#15803d">Target = { h₃,₃, h₃,₄, h₃,₅ }</text>
      <text x="12" y="86" font-size="11" fill="#334155">contribuendo ad allargare il RF al livello 3.</text>
    </g>
  </g>
</svg>
