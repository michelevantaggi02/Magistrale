<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .tag-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; }
      .vec-text { font-family: monospace; font-size: 12px; fill: #1e293b; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect width="960" height="460" fill="#f8fafc" rx="12" />

  <!-- Sezione Sinistra: Detector (Individuazione Punti Notabili / Keypoint) -->
  <g transform="translate(40, 30)">
    <rect width="360" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10" />
    <rect x="0" y="0" width="360" height="40" fill="#f1f5f9" rx="10" />
    <text x="180" y="25" text-anchor="middle" class="title-text">1. Detector: "Dove si trovano i punti?"</text>

    <!-- Casetta -->
    <g transform="translate(130, 110)">
      <!-- Pareti -->
      <rect x="0" y="60" width="100" height="90" fill="#e2e8f0" stroke="#334155" stroke-width="2.5" />
      <!-- Porta -->
      <rect x="35" y="100" width="30" height="50" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <!-- Finestra -->
      <rect x="55" y="70" width="25" height="25" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
      <!-- Tetto -->
      <polygon points="50,0 -15,60 115,60" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5" />

      <!-- Punti Notabili (Features) Rilevati -->
      <!-- Punto 1: Vertice Tetto (Rose) -->
      <circle cx="50" cy="0" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <!-- Punto 2: Spigolo Base Sinistro (Blue) -->
      <circle cx="0" cy="150" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
      <!-- Punto 3: Angolo Porta Superiore (Emerald) -->
      <circle cx="35" cy="100" r="7" fill="#059669" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Legenda Detector -->
    <text x="180" y="315" text-anchor="middle" class="label-text">
      Il detector estrae le coordinate discrete: <tspan font-family="monospace">p = (x, y)</tspan>
    </text>
  </g>

  <!-- Frecce di Collegamento al Descriptor -->
  <!-- Da vertice tetto (40+130+50 = 220, 30+110+0 = 140) a vettore 1 (500, 90) -->
  <path d="M 220 140 C 330 110, 400 90, 500 90" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-rose)" />
  
  <!-- Da spigolo porta (40+130+35 = 205, 30+110+100 = 240) a vettore 2 (500, 200) -->
  <path d="M 205 240 C 320 220, 390 200, 500 200" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-emerald)" />

  <!-- Da spigolo base (40+130+0 = 170, 30+110+150 = 290) a vettore 3 (500, 310) -->
  <path d="M 170 290 C 280 320, 380 310, 500 310" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-blue)" />

  <!-- Sezione Destra: Descriptor (Creazione dei Vettori di Caratteristiche) -->
  <g transform="translate(500, 30)">
    <rect width="420" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10" />
    <rect x="0" y="0" width="420" height="40" fill="#f1f5f9" rx="10" />
    <text x="210" y="25" text-anchor="middle" class="title-text">2. Descriptor: "Cosa c'è attorno al punto?"</text>

    <!-- Vettore 1 (Vertice tetto) -->
    <g transform="translate(30, 60)">
      <rect width="360" height="60" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" rx="6" />
      <text x="15" y="22" class="tag-text" fill="#be123c">PUNTO 1 (Vertice tetto):</text>
      <!-- Celle Vettore -->
      <g transform="translate(15, 30)">
        <rect x="0" y="0" width="42" height="22" fill="#ffe4e6" stroke="#f43f5e" /><text x="21" y="15" text-anchor="middle" class="vec-text">0.82</text>
        <rect x="42" y="0" width="42" height="22" fill="#ffe4e6" stroke="#f43f5e" /><text x="63" y="15" text-anchor="middle" class="vec-text">0.14</text>
        <rect x="84" y="0" width="42" height="22" fill="#ffe4e6" stroke="#f43f5e" /><text x="105" y="15" text-anchor="middle" class="vec-text">0.95</text>
        <rect x="126" y="0" width="42" height="22" fill="#ffe4e6" stroke="#f43f5e" /><text x="147" y="15" text-anchor="middle" class="vec-text">0.02</text>
        <text x="180" y="15" font-family="sans-serif" font-size="14" fill="#9f1239">…</text>
        <rect x="200" y="0" width="42" height="22" fill="#ffe4e6" stroke="#f43f5e" /><text x="221" y="15" text-anchor="middle" class="vec-text">0.47</text>
        <text x="260" y="15" class="label-text" font-size="12">∈ ℝ¹²⁸</text>
      </g>
    </g>

    <!-- Vettore 2 (Angolo porta) -->
    <g transform="translate(30, 150)">
      <rect width="360" height="60" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" rx="6" />
      <text x="15" y="22" class="tag-text" fill="#047857">PUNTO 2 (Spigolo porta):</text>
      <g transform="translate(15, 30)">
        <rect x="0" y="0" width="42" height="22" fill="#d1fae5" stroke="#10b981" /><text x="21" y="15" text-anchor="middle" class="vec-text">0.05</text>
        <rect x="42" y="0" width="42" height="22" fill="#d1fae5" stroke="#10b981" /><text x="63" y="15" text-anchor="middle" class="vec-text">0.91</text>
        <rect x="84" y="0" width="42" height="22" fill="#d1fae5" stroke="#10b981" /><text x="105" y="15" text-anchor="middle" class="vec-text">0.34</text>
        <rect x="126" y="0" width="42" height="22" fill="#d1fae5" stroke="#10b981" /><text x="147" y="15" text-anchor="middle" class="vec-text">0.78</text>
        <text x="180" y="15" font-family="sans-serif" font-size="14" fill="#065f46">…</text>
        <rect x="200" y="0" width="42" height="22" fill="#d1fae5" stroke="#10b981" /><text x="221" y="15" text-anchor="middle" class="vec-text">0.12</text>
        <text x="260" y="15" class="label-text" font-size="12">∈ ℝ¹²⁸</text>
      </g>
    </g>

    <!-- Vettore 3 (Spigolo base) -->
    <g transform="translate(30, 240)">
      <rect width="360" height="60" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" rx="6" />
      <text x="15" y="22" class="tag-text" fill="#0369a1">PUNTO 3 (Angolo base):</text>
      <g transform="translate(15, 30)">
        <rect x="0" y="0" width="42" height="22" fill="#e0f2fe" stroke="#0ea5e9" /><text x="21" y="15" text-anchor="middle" class="vec-text">0.31</text>
        <rect x="42" y="0" width="42" height="22" fill="#e0f2fe" stroke="#0ea5e9" /><text x="63" y="15" text-anchor="middle" class="vec-text">0.27</text>
        <rect x="84" y="0" width="42" height="22" fill="#e0f2fe" stroke="#0ea5e9" /><text x="105" y="15" text-anchor="middle" class="vec-text">0.11</text>
        <rect x="126" y="0" width="42" height="22" fill="#e0f2fe" stroke="#0ea5e9" /><text x="147" y="15" text-anchor="middle" class="vec-text">0.89</text>
        <text x="180" y="15" font-family="sans-serif" font-size="14" fill="#075985">…</text>
        <rect x="200" y="0" width="42" height="22" fill="#e0f2fe" stroke="#0ea5e9" /><text x="221" y="15" text-anchor="middle" class="vec-text">0.65</text>
        <text x="260" y="15" class="label-text" font-size="12">∈ ℝ¹²⁸</text>
      </g>
    </g>

    <text x="210" y="325" text-anchor="middle" class="label-text">
      I vettori descrittori vengono confrontati tramite distanza euclidea o coseno
    </text>
  </g>

  <!-- Banner Riassuntivo Inferiore -->
  <g transform="translate(100, 395)">
    <rect width="760" height="45" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="380" y="28" text-anchor="middle" class="label-text" font-size="13">
      <tspan font-weight="bold" fill="#0f172a">Matching:</tspan> Due punti in immagini diverse vengono associati se i rispettivi vettori numerici minimizzano la distanza (massima similarità visiva).
    </text>
  </g>
</svg>
