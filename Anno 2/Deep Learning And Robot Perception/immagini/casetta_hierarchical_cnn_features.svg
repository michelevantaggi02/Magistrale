<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
      
      .col-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .map-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 4; }
      .map-grid { stroke: #f1f5f9; stroke-width: 1; }
      
      .house-wall { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .house-roof { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.5; }
      
      .corner-pt { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
      .hotspot-glow { fill: #ef4444; fill-opacity: 0.25; }
      .hotspot-core { fill: #dc2626; }
      .hotspot-blue-glow { fill: #3b82f6; fill-opacity: 0.25; }
      .hotspot-blue-core { fill: #2563eb; }
      
      .arrow-flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arr-flow); }
      .arrow-combo { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-blue-combo); }
    </style>
    <marker id="arr-flow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#64748b" />
    </marker>
    <marker id="arr-blue-combo" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1060" height="560" class="bg" />

  <!-- Intestazione Superiore -->
  <text x="35" y="32" class="title">Gerarchia Compositiva delle Feature: Dall&#39;Immagine ai Componenti Complessi</text>
  <text x="35" y="52" class="subtitle">Esempio didattico: il Layer 1 rileva i 4 corner e i bordi elementari; il Layer 2 combina i corner per individuare il quadrato delle mura</text>

  <!-- ==================== COLONNA 1: IMMAGINE DI INGRESSO (x = 35) ==================== -->
  <g transform="translate(35, 75)">
    <rect width="210" height="455" class="col-card" />
    <text x="20" y="26" class="box-title">1. Input: Immagine</text>
    <text x="20" y="42" class="text" fill="#64748b">Pixel nativi (Risoluzione H × W)</text>

    <!-- Canvas Immagine Casetta -->
    <g transform="translate(25, 70)">
      <rect width="160" height="160" class="map-bg" />
      
      <!-- Tetto triangolare (punti: (80, 25), (35, 75), (125, 75)) -->
      <polygon points="80 25, 35 75, 125 75" class="house-roof" />
      
      <!-- Mura quadrate (x=45, y=75, w=70, h=70) -->
      <rect x="45" y="75" width="70" height="70" class="house-wall" />
      
      <!-- Porta interna (x=70, y=115, w=20, h=30) -->
      <rect x="70" y="115" width="20" height="30" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2" />

      <!-- 4 Corner del Quadrato delle Mura evidenziati -->
      <circle cx="45" cy="75" r="4" class="corner-pt" />
      <text x="32" y="72" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#b45309">TL</text>

      <circle cx="115" cy="75" r="4" class="corner-pt" />
      <text x="122" y="72" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#b45309">TR</text>

      <circle cx="45" cy="145" r="4" class="corner-pt" />
      <text x="32" y="152" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#b45309">BL</text>

      <circle cx="115" cy="145" r="4" class="corner-pt" />
      <text x="122" y="152" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#b45309">BR</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="180" height="175" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="12" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Struttura Geometrica:</text>
      <text x="12" y="38" class="text">• <tspan font-weight="bold" fill="#b45309">4 Angoli Retrattili:</tspan> vertici</text>
      <text x="22" y="52" class="text">del quadrato (mura base).</text>
      <text x="12" y="72" class="text">• <tspan font-weight="bold" fill="#dc2626">Tetto Triangolare:</tspan> 2 lati</text>
      <text x="22" y="86" class="text">obliqui e vertice cuspidale.</text>
      <text x="12" y="106" class="text">• <tspan font-weight="bold" fill="#2563eb">Mura Quadrate:</tspan> pattern</text>
      <text x="22" y="120" class="text">composto da 4 spigoli e</text>
      <text x="22" y="134" class="text">4 segmenti perimetrali.</text>
      <text x="12" y="158" font-size="10" font-weight="600" fill="#64748b">Segnale privo di astrazione.</text>
    </g>
  </g>

  <!-- Freccia Flow 1 -> 2 -->
  <path d="M 252 240 L 280 240" class="arrow-flow" />

  <!-- ==================== COLONNA 2: LAYER 1 - RILEVAZIONE CORNER & BORDI (x = 285) ==================== -->
  <g transform="translate(285, 75)">
    <rect width="410" height="455" class="col-card" />
    <text x="20" y="26" class="box-title">2. Layer 1: Rilevatori di Primitive Locali</text>
    <text x="20" y="42" class="text" fill="#64748b">Filtri k = 3 specializzati nell&#39;orientamento degli spigoli e corner</text>

    <!-- 4 Mappe di Feature per i 4 Corner -->
    <!-- Mappa 1: Corner Top-Left (x=20, y=60) -->
    <g transform="translate(20, 60)">
      <rect width="80" height="80" class="map-bg" />
      <!-- Icona del filtro in miniatura -->
      <rect x="5" y="5" width="22" height="18" fill="#eff6ff" stroke="#bfdbfe" rx="2" />
      <path d="M 12 18 L 12 10 L 22 10" stroke="#1d4ed8" stroke-width="1.8" fill="none" />
      <text x="32" y="16" font-size="9" font-weight="bold" fill="#1e40af">Corner TL</text>
      <!-- Hotspot di attivazione sulla mappa (x=25, y=40 corrispondente al corner TL) -->
      <circle cx="28" cy="42" r="10" class="hotspot-glow" />
      <circle cx="28" cy="42" r="3.5" class="hotspot-core" />
      <text x="42" y="45" font-size="9" font-weight="700" fill="#dc2626">Attivazione TL</text>
    </g>

    <!-- Mappa 2: Corner Top-Right (x=210, y=60) -->
    <g transform="translate(210, 60)">
      <rect width="80" height="80" class="map-bg" />
      <rect x="5" y="5" width="22" height="18" fill="#eff6ff" stroke="#bfdbfe" rx="2" />
      <path d="M 12 10 L 22 10 L 22 18" stroke="#1d4ed8" stroke-width="1.8" fill="none" />
      <text x="32" y="16" font-size="9" font-weight="bold" fill="#1e40af">Corner TR</text>
      <!-- Hotspot di attivazione corrispondente al corner TR -->
      <circle cx="56" cy="42" r="10" class="hotspot-glow" />
      <circle cx="56" cy="42" r="3.5" class="hotspot-core" />
      <text x="12" y="70" font-size="9" font-weight="700" fill="#dc2626">Attivazione TR</text>
    </g>

    <!-- Mappa 3: Corner Bottom-Left (x=20, y=155) -->
    <g transform="translate(20, 155)">
      <rect width="80" height="80" class="map-bg" />
      <rect x="5" y="5" width="22" height="18" fill="#eff6ff" stroke="#bfdbfe" rx="2" />
      <path d="M 12 10 L 12 18 L 22 18" stroke="#1d4ed8" stroke-width="1.8" fill="none" />
      <text x="32" y="16" font-size="9" font-weight="bold" fill="#1e40af">Corner BL</text>
      <!-- Hotspot corrispondente a BL -->
      <circle cx="28" cy="62" r="10" class="hotspot-glow" />
      <circle cx="28" cy="62" r="3.5" class="hotspot-core" />
      <text x="42" y="65" font-size="9" font-weight="700" fill="#dc2626">Attivazione BL</text>
    </g>

    <!-- Mappa 4: Corner Bottom-Right (x=210, y=155) -->
    <g transform="translate(210, 155)">
      <rect width="80" height="80" class="map-bg" />
      <rect x="5" y="5" width="22" height="18" fill="#eff6ff" stroke="#bfdbfe" rx="2" />
      <path d="M 12 18 L 22 18 L 22 10" stroke="#1d4ed8" stroke-width="1.8" fill="none" />
      <text x="32" y="16" font-size="9" font-weight="bold" fill="#1e40af">Corner BR</text>
      <!-- Hotspot corrispondente a BR -->
      <circle cx="56" cy="62" r="10" class="hotspot-glow" />
      <circle cx="56" cy="62" r="3.5" class="hotspot-core" />
      <text x="12" y="75" font-size="9" font-weight="700" fill="#dc2626">Attivazione BR</text>
    </g>

    <!-- Mappa Ausiliaria: Bordo Obliquo (Tetto) (x=305, y=105) -->
    <g transform="translate(305, 105)">
      <rect width="85" height="85" class="map-bg" />
      <rect x="5" y="5" width="22" height="18" fill="#fef2f2" stroke="#fecaca" rx="2" />
      <line x1="12" y1="20" x2="22" y2="8" stroke="#dc2626" stroke-width="1.8" />
      <text x="32" y="16" font-size="8" font-weight="bold" fill="#991b1b">Pendenza 45°</text>
      <line x1="28" y1="62" x2="52" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <text x="12" y="75" font-size="9" font-weight="700" fill="#dc2626">Bordo Tetto</text>
    </g>

    <!-- Box Descrizione Layer 1 -->
    <g transform="translate(20, 255)">
      <rect width="370" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Dinamica del Primo Livello:</text>
      <text x="14" y="42" class="text">• Ciascun filtro convoluzionale opera su una finestra ristretta di pixel ($3 \times 3$).</text>
      <text x="14" y="60" class="text">• I filtri si specializzano nel rilevare <tspan font-weight="bold" fill="#b45309">gradienti di intensità locali</tspan> (angoli a $90^\circ$,</text>
      <text x="24" y="74" class="text">orientazioni oblique, linee orizzontali/verticali).</text>
      <text x="14" y="94" class="text">• Nelle feature map corrispondenti compaiono <tspan font-weight="bold" fill="#dc2626">hotspot di attivazione</tspan></text>
      <text x="24" y="108" class="text">esattamente nelle coordinate spaziali $(x, y)$ in cui quel pattern è presente.</text>
      <text x="14" y="130" font-size="11" font-weight="700" fill="#2563eb">→ Nessun singolo neurone del Layer 1 conosce l&#39;intera casetta;</text>
      <text x="24" y="146" font-size="10" fill="#334155">ciascun neurone segnala unicamente la presenza locale del proprio corner.</text>
    </g>
  </g>

  <!-- Frecce di combinazione da Layer 1 a Layer 2 -->
  <path d="M 700 240 L 730 240" class="arrow-flow" />

  <!-- ==================== COLONNA 3: LAYER 2 - COMPOSIZIONE STRUTTURE (x = 735) ==================== -->
  <g transform="translate(735, 75)">
    <rect width="290" height="455" class="col-card" />
    <text x="20" y="26" class="box-title">3. Layer 2: Composizione Mura &amp; Forma</text>
    <text x="20" y="42" class="text" fill="#64748b">Receptive field allargato (RF = 5 o pooling)</text>

    <!-- Feature Map Complessa: "Quadrato / Mura Casetta" -->
    <g transform="translate(65, 65)">
      <rect width="160" height="160" class="map-bg" />
      <text x="10" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e40af">Mappa Feature: MURA</text>

      <!-- Silhouette mura che combina i 4 corner -->
      <rect x="45" y="45" width="70" height="70" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,4" />
      
      <!-- Attivazione globale centrata sulle mura -->
      <ellipse cx="80" cy="80" rx="35" ry="35" class="hotspot-blue-glow" />
      <circle cx="80" cy="80" rx="8" ry="8" class="hotspot-blue-core" />

      <text x="80" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">Rilevamento "Mura Intere"</text>
    </g>

    <!-- Box Descrizione Layer 2 -->
    <g transform="translate(15, 255)">
      <rect width="260" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6" />
      <text x="12" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Integrazione Strutturale:</text>
      <text x="12" y="38" class="text">• Il filtro volumetrico di Layer 2 campiona</text>
      <text x="20" y="52" class="text"><tspan font-weight="bold">simultaneamente tutte le mappe</tspan> di Layer 1.</text>
      <text x="12" y="72" class="text">• Correlazione congiunta: la cella centrale</text>
      <text x="20" y="86" class="text">si attiva intensamente se e solo se riceve</text>
      <text x="20" y="100" class="text"><tspan font-weight="bold" fill="#1d4ed8">i 4 segnali dei corner</tspan> nelle posizioni</text>
      <text x="20" y="114" class="text">spaziali mutue corrette.</text>
      <text x="12" y="136" font-size="11" font-weight="700" fill="#15803d">→ Astrazione Semantica:</text>
      <text x="20" y="152" font-size="10" fill="#334155">I corner isolati vengono sintetizzati nel</text>
      <text x="20" y="166" font-size="10" fill="#334155">concetto visivo unificato di "Parete/Mura".</text>
    </g>
  </g>
</svg>
