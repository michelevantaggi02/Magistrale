<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1e293b; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
      .bold { font-weight: 600; }
      .arrow { stroke: #475569; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowhead-blue); fill: none; }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrowhead-purple); fill: none; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .sum-node { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .act-box { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2.5; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed" />
    </marker>
  </defs>

  <rect width="950" height="480" class="bg" />

  <!-- Header -->
  <text x="40" y="38" class="title">Architettura del Neurone Artificiale: Dalla Combinazione Affine al Corner Detector</text>
  <text x="40" y="58" class="subtitle">Esempio didattico: somma pesata z = w^T h + b, funzione di attivazione f(·) ed eccitazione visiva specifica (rilevatore di angoli)</text>

  <!-- Input Feat h_{l-1} (3 ingressi) -->
  <g transform="translate(60, 110)">
    <!-- In 1 -->
    <rect x="0" y="10" width="70" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6" />
    <text x="35" y="35" text-anchor="middle" class="text math bold">h_(l-1, 1)</text>

    <!-- In 2 -->
    <rect x="0" y="80" width="70" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6" />
    <text x="35" y="105" text-anchor="middle" class="text math bold">h_(l-1, 2)</text>

    <!-- In 3 -->
    <rect x="0" y="150" width="70" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6" />
    <text x="35" y="175" text-anchor="middle" class="text math bold">h_(l-1, 3)</text>
  </g>

  <!-- Pesi sinaptici w1, w2, w3 e frecce verso Sum Node -->
  <path d="M 130 140 L 290 190" class="arrow" />
  <rect x="180" y="145" width="45" height="22" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <text x="202" y="160" text-anchor="middle" class="text math bold" fill="#2563eb">w_1</text>

  <path d="M 130 210 L 290 210" class="arrow" />
  <rect x="180" y="199" width="45" height="22" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <text x="202" y="214" text-anchor="middle" class="text math bold" fill="#2563eb">w_2</text>

  <path d="M 130 280 L 290 230" class="arrow" />
  <rect x="180" y="253" width="45" height="22" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <text x="202" y="268" text-anchor="middle" class="text math bold" fill="#2563eb">w_3</text>

  <!-- Ingresso Bias in alto -->
  <g transform="translate(325, 75)">
    <circle cx="20" cy="20" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="20" y="25" text-anchor="middle" class="text bold" fill="#b45309">+1</text>
    <path d="M 20 40 L 20 85" class="arrow" />
    <text x="35" y="65" class="text math bold" fill="#d97706">b (bias)</text>
  </g>

  <!-- NODO DI SOMMA AFFINE (Cerchio centrale) -->
  <g transform="translate(295, 165)">
    <circle cx="50" cy="50" r="48" class="sum-node" />
    <text x="50" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#1d4ed8">∑</text>
    <text x="50" y="70" text-anchor="middle" class="text math bold" font-size="13" fill="#1e40af">w^T h + b</text>

    <!-- Formula sopra al nodo -->
    <rect x="-35" y="-55" width="170" height="30" fill="#eff6ff" stroke="#93c5fd" rx="6" />
    <text x="50" y="-35" text-anchor="middle" class="text math bold" font-size="14" fill="#1e3a8a">z = w^T h_(l-1) + b</text>
  </g>

  <!-- Freccia da Somma a Funzione di Attivazione -->
  <line x1="395" y1="215" x2="485" y2="215" class="arrow-blue" />
  <text x="440" y="205" text-anchor="middle" class="text math bold" fill="#2563eb">z</text>

  <!-- BLOCCO FUNZIONE DI ATTIVAZIONE f(·) -->
  <g transform="translate(490, 150)">
    <rect width="130" height="130" class="act-box" />
    <text x="65" y="30" text-anchor="middle" class="box-title" fill="#6d28d9">Non-Linearità</text>
    <text x="65" y="50" text-anchor="middle" class="text math bold" font-size="18" fill="#7c3aed">f(z)</text>
    
    <!-- Icona curva attivazione -->
    <g transform="translate(25, 60)">
      <line x1="5" y1="50" x2="75" y2="50" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="40" y1="5" x2="40" y2="55" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- ReLU curve -->
      <path d="M 10 50 L 40 50 L 70 10" stroke="#7c3aed" stroke-width="2.5" fill="none" />
    </g>
    <text x="65" y="122" text-anchor="middle" font-size="10" fill="#64748b">ReLU / GeLU / ecc.</text>
  </g>

  <!-- Uscita Finale h_l -->
  <line x1="620" y1="215" x2="720" y2="215" class="arrow-purple" />
  <g transform="translate(725, 185)">
    <rect width="180" height="60" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" rx="8" />
    <text x="90" y="28" text-anchor="middle" class="box-title" fill="#5b21b6">Output Attivazione</text>
    <text x="90" y="48" text-anchor="middle" class="text math bold" font-size="15" fill="#6d28d9">h_l = f(w^T h_(l-1) + b)</text>
  </g>

  <!-- INGRESSO VISIVO DAL BASSO: CORNER DETECTOR -->
  <g transform="translate(270, 315)">
    <!-- Freccia verticale che sale verso il neurone -->
    <path d="M 75 80 L 75 0" class="arrow-blue" />
    
    <!-- Box Corner Feature Patch -->
    <g transform="translate(0, 80)">
      <rect width="150" height="75" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" rx="6" />
      
      <!-- Mini Patch Immagine con Corner L-shape -->
      <g transform="translate(10, 10)">
        <rect width="55" height="55" fill="#e2e8f0" stroke="#94a3b8" />
        <!-- dark region top-right forming corner -->
        <polygon points="0,0 55,0 55,55 25,55 25,25 0,25" fill="#334155" />
        <circle cx="25" cy="25" r="4" fill="#ef4444" />
      </g>

      <text x="75" y="26" class="box-title" font-size="11" fill="#1e3a8a">Ruolo Semantico:</text>
      <text x="75" y="42" class="text bold" font-size="11" fill="#0284c7">Corner Detector</text>
      <text x="75" y="58" class="text" font-size="10" fill="#64748b">Filtro specializzato</text>
    </g>
    <text x="75" y="45" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Feature visiva appresa</text>
  </g>
</svg>