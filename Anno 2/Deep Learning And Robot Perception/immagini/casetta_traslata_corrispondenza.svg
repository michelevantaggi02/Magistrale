<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .highlight-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #e11d48; }
      .formula-text { font-family: monospace; font-size: 13px; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="380" fill="#f8fafc" rx="12" />

  <!-- Frame Immagine 1 (Originale / Posa A) -->
  <g transform="translate(60, 40)">
    <rect width="320" height="240" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" />
    <text x="160" y="-12" text-anchor="middle" class="title-text">Immagine 1 (Frame iniziale)</text>
    
    <!-- Casetta a Destra -->
    <g transform="translate(190, 80)">
      <!-- Pareti -->
      <rect x="0" y="50" width="80" height="70" fill="#e2e8f0" stroke="#334155" stroke-width="2.5" />
      <!-- Porta -->
      <rect x="25" y="85" width="30" height="35" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <!-- Finestra -->
      <rect x="45" y="55" width="20" height="20" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
      <!-- Tetto -->
      <polygon points="40,0 -10,50 90,50" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5" />
      
      <!-- Keypoint vertice tetto -->
      <circle cx="40" cy="0" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="40" cy="0" r="14" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="40" y="-15" text-anchor="middle" class="highlight-text">p₁ = (x₁, y₁)</text>
    </g>
  </g>

  <!-- Frame Immagine 2 (Traslata / Posa B) -->
  <g transform="translate(520, 40)">
    <rect width="320" height="240" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8" />
    <text x="160" y="-12" text-anchor="middle" class="title-text">Immagine 2 (Frame traslato)</text>
    
    <!-- Casetta spostata a Sinistra e leggermente in basso -->
    <g transform="translate(50, 100)">
      <!-- Pareti -->
      <rect x="0" y="50" width="80" height="70" fill="#e2e8f0" stroke="#334155" stroke-width="2.5" />
      <!-- Porta -->
      <rect x="25" y="85" width="30" height="35" fill="#94a3b8" stroke="#334155" stroke-width="2" />
      <!-- Finestra -->
      <rect x="45" y="55" width="20" height="20" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" />
      <!-- Tetto -->
      <polygon points="40,0 -10,50 90,50" fill="#fca5a5" stroke="#dc2626" stroke-width="2.5" />
      
      <!-- Keypoint vertice tetto corrispondente -->
      <circle cx="40" cy="0" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
      <circle cx="40" cy="0" r="14" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="40" y="-15" text-anchor="middle" class="highlight-text">p₂ = (x₂, y₂)</text>
    </g>
  </g>

  <!-- Corrispondenza e Vettore di Spostamento tra le due immagini -->
  <!-- p1 globale: 60 + 190 + 40 = 290, 40 + 80 + 0 = 120 -->
  <!-- p2 globale: 520 + 50 + 40 = 610, 40 + 100 + 0 = 140 -->
  <path d="M 290 120 C 400 80, 500 90, 610 140" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- Box Informativo Inferiore -->
  <g transform="translate(150, 310)">
    <rect width="600" height="50" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="8" />
    <text x="300" y="24" text-anchor="middle" class="title-text" fill="#0369a1" font-size="14">
      Problema della Corrispondenza (Matching)
    </text>
    <text x="300" y="42" text-anchor="middle" class="label-text" font-size="13">
      Identificando lo stesso punto fisico p₁ ↔ p₂ si stima la trasformazione (Δx, Δy) o l'omografia tra i frame
    </text>
  </g>
</svg>
